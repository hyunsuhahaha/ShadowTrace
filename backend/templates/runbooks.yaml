schema_version: 1
runbooks:
  - key: target-baseline
    revision: 1
    name: Target 기본 식별
    description: 서비스 조사 전에 호스트명과 운영체제 단서를 확인합니다.
    tags: [target, baseline]
    service_names: []
    ports: []
    steps:
      - title: 호스트명 확인
        command_refs: [target-hostname-identity]
        expected_observations: [PTR 또는 NetBIOS 호스트명, 도메인 단서]
      - title: 운영체제 확인
        command_refs: [target-os-identity]
        expected_observations: [운영체제 계열, 호스트명, 네트워크 거리]
      - title: Target 메모 정리
        description: 확인한 값과 불확실한 추정을 구분해 기록합니다.
        expected_observations: [확인된 호스트명, 운영체제 추정 근거]

  - key: ftp-baseline
    revision: 3
    name: FTP 기본 열거
    description: 익명 접근, 서버 정보와 수동 파일 접근 범위를 확인합니다.
    tags: [ftp, enumeration]
    service_names: [ftp]
    ports: [21]
    steps:
      - title: Anonymous 접근 확인
        node_key: anonymous
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, target: permissions, label: 익명 접근 확인}
          - {when: {outcome: [access_denied, authentication_required]}, target: authenticated, label: 인증 경로 필요}
          - {default: true, target: evidence, label: 수동 판정}
        error_policy: {retry: {max_attempts: 2}}
        command_refs: [ftp-anon]
        expected_observations: [로그인 허용 여부, 공개 파일과 디렉터리, 쓰기 가능 여부]
        guidance: {stage_id: anonymous, phase: access, question: "인증 없이 어떤 파일과 디렉터리에 접근할 수 있는가?", purpose: "익명 세션의 실제 공개 범위를 확인합니다.", manual_checks: ["목록·다운로드·업로드를 각각 구분해 기록"], prerequisites: ["FTP 제품 식별"], auth: anonymous, safety: low, next_steps: {confirmed: [permissions], access_denied: [authenticated]}}
      - title: 서버 정보 확인
        node_key: identity
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, target: anonymous, label: FTP 확인}
          - {default: true, target: evidence, label: 식별 검토}
        error_policy: {retry: {max_attempts: 2}}
        command_refs: [ftp-syst]
        expected_observations: [FTP 서버 제품, 운영체제 단서, 지원 기능]
        guidance: {stage_id: identity, phase: identification, question: "실제 FTP 제품·버전과 지원 기능은 무엇인가?", purpose: "배너 추측과 프로토콜 응답을 구분해 식별합니다.", manual_checks: ["SYST와 FEAT 응답 비교"], prerequisites: [], auth: none, safety: low, next_steps: {confirmed: [anonymous]}}
      - title: 수동 세션 검증
        node_key: permissions
        node_type: manual_check
        transitions:
          - {default: true, target: evidence, label: 결과 정리}
        command_refs: [ftp-client]
        expected_observations: [접근 가능한 경로, 파일 권한, 배너와 오류 메시지]
        guidance: {stage_id: permissions, phase: authorization, question: "계정과 경로별 읽기·쓰기 범위가 어떻게 다른가?", purpose: "실제 권한 경계를 비교합니다.", manual_checks: ["PWD·LIST·GET·PUT 결과를 계정별로 기록"], prerequisites: ["승인된 자격 증명 또는 익명 접근"], auth: optional, safety: low, next_steps: {confirmed: [attack_surface]}}
      - title: Evidence와 Credential 정리
        node_key: evidence
        node_type: evidence
        expected_observations: [중요 출력 Evidence, 재사용 가능한 계정 메타데이터]
      - title: 승인된 계정으로 접근 확인
        node_key: authenticated
        node_type: approval
        approval: {required: true, reason: "저장된 Credential을 FTP 인증에 사용"}
        transitions:
          - {when: {approval_status: approved}, target: permissions, label: 승인됨}
          - {default: true, target: evidence, label: 인증 생략}
        expected_observations: [인증 성공 여부, 계정별 루트 경로와 권한 차이]

  - key: ssh-baseline
    revision: 1
    name: SSH 기본 열거
    description: 암호화 설정, 인증 방식과 승인된 수동 접근을 확인합니다.
    tags: [ssh, enumeration]
    service_names: [ssh]
    ports: [22]
    steps:
      - title: 알고리즘 확인
        command_refs: [ssh-enum]
        expected_observations: [키 교환, 호스트 키, 암호화, MAC 알고리즘]
      - title: 인증 방식 확인
        command_refs: [ssh-auth-methods]
        expected_observations: [password 또는 publickey 허용 여부, 사용자명 반응 차이]
      - title: 제한된 기본 Credential 점검
        command_refs: [ssh-default-audit]
        expected_observations: [성공한 계정, 잠금 또는 속도 제한 신호]
      - title: 승인된 Credential로 수동 접속
        command_refs: [ssh-client]
        expected_observations: [로그인 성공 여부, 셸과 권한, 호스트 키]

  - key: telnet-baseline
    revision: 1
    name: Telnet 기본 열거
    description: 배너, 협상 정보, 인증과 수동 접근을 확인합니다.
    tags: [telnet, enumeration]
    service_names: [telnet]
    ports: [23]
    steps:
      - title: 서비스 상세 확인
        command_refs: [telnet-info]
        expected_observations: [제품과 버전, 암호화 지원, NTLM 정보]
      - title: 원시 배너 확인
        command_refs: [telnet-banner]
        expected_observations: [로그인 전 배너, 장비 또는 운영체제 단서]
      - title: 식별이 불명확하면 Probe 추적
        command_refs: [telnet-version-trace]
        expected_observations: [응답한 Probe, 제품 식별 근거]
      - title: 제한된 기본 Credential 점검
        command_refs: [telnet-default-audit]
        expected_observations: [성공 계정, 잠금 또는 지연 신호]
      - title: 수동 접속
        command_refs: [telnet-client]
        expected_observations: [인증 흐름, 셸 또는 관리 인터페이스]

  - key: smtp-baseline
    revision: 1
    name: SMTP 기본 열거
    description: 공개 명령, 인증 방식과 제한된 Credential 반응을 확인합니다.
    tags: [smtp, mail, enumeration]
    service_names: [smtp, smtps, submission]
    ports: [25, 465, 587]
    steps:
      - title: 지원 명령 확인
        command_refs: [smtp-info]
        expected_observations: [EHLO 기능, AUTH 방식, STARTTLS, 서버 제품]
      - title: 사용자·릴레이 동작 수동 확인
        expected_observations: [VRFY 또는 EXPN 반응, 릴레이 거부, 도메인 정보]
      - title: 제한된 기본 Credential 점검
        command_refs: [smtp-default-audit]
        expected_observations: [인증 성공 여부, 잠금 또는 속도 제한]

  - key: dns-baseline
    revision: 1
    name: DNS 기본 열거
    description: DNS 메타데이터, 재귀와 권한 정보를 확인합니다.
    tags: [dns, enumeration]
    service_names: [domain, dns]
    ports: [53]
    steps:
      - title: 서비스 정보와 재귀 확인
        command_refs: [dns-info]
        expected_observations: [NSID 또는 버전 단서, 외부 재귀 허용 여부]
      - title: 권한 레코드와 이름 수집
        expected_observations: [NS, SOA, MX, TXT, A와 PTR 레코드]
      - title: Zone transfer 수동 확인
        description: 확인된 권한 DNS와 도메인에 대해서만 AXFR 가능 여부를 확인합니다.
        expected_observations: [AXFR 허용 또는 거부, 노출된 호스트명]

  - key: http-baseline
    revision: 3
    name: HTTP 기본 점검
    description: 웹 기술, 응답 헤더, 인증 경로와 수동 애플리케이션 점검 범위를 정리합니다.
    tags: [http, web, enumeration]
    service_names: [http, https, http-proxy, ssl/http]
    ports: [80, 443, 8080, 8443]
    steps:
      - title: 응답 헤더 확인
        node_key: identity
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, targets: [stack, resources], label: 웹 서비스 확인}
          - {default: true, target: resources, label: 수동 웹 확인}
        error_policy: {retry: {max_attempts: 2}}
        command_refs: [http-headers, http-methods, http-tls-info]
        expected_observations: [상태와 redirect, Server 헤더, 보안 헤더, Cookie 속성]
        guidance: {stage_id: identity, phase: identification, question: "웹 서버·TLS·허용 메서드가 무엇을 노출하는가?", purpose: "비표준 포트를 포함해 웹 계층과 기본 구성을 식별합니다.", manual_checks: ["리다이렉트 최종 호스트와 인증서 이름 비교"], prerequisites: [], auth: none, safety: low, next_steps: {confirmed: [resources]}}
      - title: 기술 스택 식별
        node_key: stack
        node_type: command
        transitions:
          - {default: true, target: resources, label: 기능 매핑}
        command_refs: [http-whatweb]
        expected_observations: [웹 서버, 프레임워크, CMS, JavaScript 라이브러리]
      - title: 인증 경로 확인
        node_key: authentication
        node_type: manual_check
        transitions:
          - {when: {outcome: confirmed}, target: credential-check, label: 인증 경로 발견}
          - {default: true, target: request-evidence, label: 인증 경로 없음 또는 보류}
        command_refs: [http-auth-finder]
        expected_observations: [Basic·Digest·NTLM 경로, 로그인 진입점]
      - title: 콘텐츠와 기능 수동 매핑
        node_key: resources
        node_type: manual_check
        transitions:
          - {when: {outcome: confirmed}, targets: [authentication, request-evidence], label: 기능 확인}
          - {default: true, target: request-evidence, label: 관찰 정리}
        expected_observations: [페이지와 API 경로, 입력 지점, 업로드, 관리자 기능]
        guidance: {stage_id: resources, phase: exposure, question: "외부에 공개된 페이지·API·관리 기능은 무엇인가?", purpose: "URL 목록이 아니라 기능과 신뢰 경계를 매핑합니다.", manual_checks: ["가상 호스트·API·업로드·관리 경로를 기능별로 기록"], prerequisites: ["기본 웹 식별"], auth: optional, safety: low, next_steps: {confirmed: [authorization]}}
      - title: 제한된 루트 인증 점검
        node_key: credential-check
        node_type: approval
        approval: {required: true, reason: "승인된 Credential을 웹 인증에 사용"}
        transitions:
          - {default: true, target: request-evidence, label: 인증 결과 정리}
        command_refs: [http-default-audit]
        expected_observations: [인증 성공 여부, 잠금 또는 속도 제한]
      - title: Web Testing에서 요청 검증
        node_key: request-evidence
        node_type: evidence
        expected_observations: [재현 가능한 요청·응답, 세션과 권한 차이, Evidence]

  - key: smb-baseline
    revision: 3
    name: SMB 기본 열거
    description: 공유, 사용자, Null·Guest 접근과 승인된 Credential 접근을 확인합니다.
    tags: [smb, windows, enumeration]
    service_names: [microsoft-ds, netbios-ssn, smb]
    ports: [139, 445]
    steps:
      - title: 공유와 사용자 확인
        node_key: exposure
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, target: anonymous, label: SMB 노출 확인}
          - {when: {outcome: [access_denied, authentication_required]}, target: authenticated, label: 인증 필요}
          - {default: true, target: evidence, label: 수동 검토}
        error_policy: {retry: {max_attempts: 2}}
        command_refs: [smb-enum, smb-security]
        expected_observations: [공유 목록, 사용자와 도메인 단서, 접근 권한]
        guidance: {stage_id: exposure, phase: exposure, question: "어떤 프로토콜·서명 설정과 공유가 외부에 공개되는가?", purpose: "SMB 설정과 공개 자원을 함께 확인합니다.", manual_checks: ["공유명과 연결 가능 여부를 별도로 기록"], prerequisites: [], auth: anonymous, safety: low, next_steps: {confirmed: [anonymous]}}
      - title: Null·Guest 세션 확인
        node_key: anonymous
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, target: permissions, label: 익명 세션 확인}
          - {when: {outcome: [access_denied, authentication_required]}, target: authenticated, label: 인증 경로 필요}
          - {default: true, target: evidence, label: 판정 보류}
        error_policy: {retry: {max_attempts: 2}}
        command_refs: [smb-null-session]
        expected_observations: [인증 없는 공유 열람, Guest 매핑, 오류 차이]
        guidance: {stage_id: anonymous, phase: access, question: "Null·Guest 세션으로 어떤 정보가 노출되는가?", purpose: "세션 성립과 실제 열거 권한을 구분합니다.", manual_checks: ["접속 성공·목록 성공·읽기 성공을 별도 판정"], prerequisites: ["SMB 서비스 확인"], auth: anonymous, safety: low, next_steps: {confirmed: [permissions], access_denied: [authenticated]}}
      - title: 제한된 기본 Credential 점검
        node_key: authenticated
        node_type: approval
        approval: {required: true, reason: "저장된 Credential을 SMB 인증에 사용"}
        transitions:
          - {when: {approval_status: approved}, target: permissions, label: 승인됨}
          - {default: true, target: evidence, label: 인증 생략}
        command_refs: [smb-default-audit]
        expected_observations: [성공 계정, 잠금 감지, 도메인 문맥]
      - title: 수동 공유 접근
        node_key: permissions
        node_type: manual_check
        transitions:
          - {default: true, target: evidence, label: 권한 결과 정리}
        command_refs: [smb-client]
        expected_observations: [읽기·쓰기 가능한 공유, 민감 파일, 사용자별 권한 차이]
      - title: Credential 재사용 후보 표시
        node_key: evidence
        node_type: evidence
        expected_observations: [다른 SMB·WinRM·RDP 서비스 재확인 대상]

  - key: nfs-baseline
    revision: 1
    name: NFS 기본 열거
    description: Export와 호스트·UID/GID 기반 접근 범위를 확인합니다.
    tags: [nfs, rpc, enumeration]
    service_names: [nfs, rpcbind]
    ports: [111, 2049]
    steps:
      - title: Export 목록 확인
        command_refs: [nfs-showmount]
        expected_observations: [Export 경로, 허용 호스트 또는 네트워크]
      - title: 마운트와 파일 권한 수동 확인
        expected_observations: [읽기·쓰기, UID/GID 매핑, root squash]
      - title: 민감 파일 Evidence 정리
        expected_observations: [키·설정·백업 파일의 위치와 권한]

  - key: ldap-baseline
    revision: 2
    name: LDAP·Kerberos 기본 열거
    description: RootDSE, Base DN, 도메인 문맥과 승인된 인증 범위를 확인합니다.
    tags: [ldap, kerberos, active-directory]
    service_names: [ldap, ldaps, kerberos-sec]
    ports: [88, 389, 636]
    steps:
      - title: RootDSE 확인
        command_refs: [ldap-rootdse]
        expected_observations: [Base DN, naming contexts, 도메인과 서버 기능]
      - title: 익명 조회 범위 확인
        command_refs: [ldap-anonymous-users]
        expected_observations: [익명 bind 허용 여부, 공개 객체와 속성, 사용자 목록]
      - title: 제한된 기본 Credential 점검
        command_refs: [ldap-default-audit]
        expected_observations: [bind 성공 여부, Base DN 요구, 잠금 신호]
      - title: AD Information에 객체 정리
        expected_observations: [사용자, 그룹, 컴퓨터, SPN과 출처]

  - key: database-baseline
    revision: 3
    name: Database 기본 열거
    description: 데이터베이스 제품을 식별하고 제품별 무인증·제한 Credential 검사를 안내합니다.
    tags: [database, enumeration]
    service_names: [ms-sql-s, mysql, postgresql, redis]
    ports: [1433, 3306, 5432, 6379]
    steps:
      - title: 제품과 버전 식별
        node_key: identity
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, targets: [mysql-anonymous, redis-anonymous, authenticated], label: 제품별 접근 확인}
          - {default: true, target: authenticated, label: 인증 경로 확인}
        error_policy: {retry: {max_attempts: 2}}
        command_refs: [database-info]
        expected_observations: [제품, 버전, 프로토콜과 TLS]
        guidance: {stage_id: identity, phase: identification, question: "실제 데이터베이스 제품·버전·TLS 구성은 무엇인가?", purpose: "제품별 후속 절차를 선택할 근거를 확보합니다.", manual_checks: ["배너와 Nmap 탐지 근거 비교"], prerequisites: [], auth: none, safety: low, next_steps: {confirmed: [anonymous]}}
      - title: MySQL 빈 비밀번호 확인
        node_key: mysql-anonymous
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, target: permissions, label: 무인증 접근 확인}
          - {default: true, target: authenticated, label: 인증 필요}
        command_refs: [mysql-empty-password]
        expected_observations: [빈 비밀번호 허용 여부]
        condition: {kind: current_service_is, service_name: mysql}
      - title: Redis 무인증 정보 확인
        node_key: redis-anonymous
        node_type: command
        transitions:
          - {when: {outcome: confirmed}, target: permissions, label: 무인증 접근 확인}
          - {default: true, target: authenticated, label: 인증 필요}
        command_refs: [redis-unauthenticated-info]
        expected_observations: [인증 없는 INFO 응답, 버전과 역할]
        condition: {kind: current_service_is, service_name: redis}
      - title: 제품별 제한 Credential 점검
