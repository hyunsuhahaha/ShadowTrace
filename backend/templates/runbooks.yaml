  # PTES/NIST engagement flow. These are operator decisions, never automatic actions.
  - key: assessment-lifecycle
    revision: 1
    name: 승인된 평가 흐름
    description: PTES·NIST 800-115의 범위 합의부터 재검증까지 Target별 결정과 근거를 기록합니다.
    tags: [target, methodology, engagement]
    service_names: []
    ports: []
    steps:
      - title: 범위와 허용 조건 확정
        node_key: scope
        node_type: approval
        approval: {required: true, reason: "승인된 대상·기간·제외 범위·허용 강도 확인"}
        transitions:
          - {when: {approval_status: approved}, target: discovery, label: 범위 승인}
          - {default: true, target: closure, label: 범위 미확정}
        expected_observations: [승인된 대상, 제외 자산, 테스트 기간, 허용된 기법과 중단 연락처]
        guidance: {stage_id: scope, phase: pre_engagement, question: "누가 어떤 대상과 행위를 언제 승인했는가?", purpose: "범위 밖 작업을 차단하고 판단 근거를 남깁니다.", manual_checks: ["승인자·기간·IP/도메인·제외 대상 기록", "작업 강도와 중단 조건 확인"], safety: approval}
      - title: 정찰과 서비스 표면 정리
        node_key: discovery
        node_type: manual_check
        transitions:
          - {default: true, target: hypotheses, label: 관찰 정리}
        expected_observations: [확인된 호스트와 서비스, 미확인 단서, 범위 밖 후보]
        guidance: {stage_id: discovery, phase: intelligence, question: "실제로 확인한 표면과 아직 추정인 것은 무엇인가?", purpose: "관찰과 추정을 분리합니다.", manual_checks: ["수동 탐색과 스캔 결과를 출처별로 기록", "새로 발견된 자산은 승인 범위를 다시 확인"], safety: low}
      - title: 위협 가설과 우선순위
        node_key: hypotheses
        node_type: manual_check
        transitions:
          - {default: true, target: validation, label: 검증 후보 선정}
        expected_observations: [중요 자산, 예상 신뢰 경계, 후보별 근거와 우선순위]
        guidance: {stage_id: hypotheses, phase: threat_modeling, question: "어떤 경로가 평가 목표에 영향을 줄 수 있는가?", purpose: "검증 순서를 명시적으로 결정합니다.", manual_checks: ["업무 영향과 접근 조건을 후보마다 기록"], safety: passive}
      - title: 후보를 수동 검증
        node_key: validation
        node_type: manual_check
        transitions:
          - {when: {outcome: confirmed}, target: impact-approval, label: 영향 검증 후보 확인}
          - {default: true, target: reporting, label: 미발견·보류·실패도 기록}
        expected_observations: [재현 가능한 요청 또는 명령, 긍정·부정 결과, 오류와 불확실성]
        guidance: {stage_id: validation, phase: vulnerability_analysis, question: "관찰된 현상이 실제 보안 경계를 넘는가?", purpose: "자동 결과를 그대로 취약점으로 단정하지 않습니다.", manual_checks: ["정상 동작과 오탐 비교", "재현 조건과 원문 증거 연결"], safety: low}
      - title: 영향 검증 승인
        node_key: impact-approval
        node_type: approval
