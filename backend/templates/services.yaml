    - {id: snmp-community-audit, name: SNMP Community 문자열 제한 점검, description: Nmap 기본 Community 목록 중 12개를 최대 2분 동안 점검합니다. 지연·동시성 제한은 지원되지 않습니다., command: "nmap -Pn -sU -p{port} --script snmp-brute --script-args unpwdb.passlimit=12,unpwdb.timelimit=2m,snmp.retries=1,snmp.timeout=2s {host}", execution_mode: captured, risk: high, tool: nmap, sudo: true, output: text, policy: allowed}
mail:
  display_name: IMAP and POP3
  match: {services: [imap, imaps, pop3, pop3s], ports: [110, 143, 993, 995]}
  commands:
    - {id: imap-default-audit, name: IMAP 기본 자격증명 제한 점검, description: IMAP에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script imap-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [imap, imaps], ports: [143, 993]}}
    - {id: pop3-default-audit, name: POP3 기본 자격증명 제한 점검, description: POP3에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script pop3-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [pop3, pop3s], ports: [110, 995]}}
vnc:
  display_name: VNC
  match: {services: [vnc], ports: [5900, 5901, 5902]}
  commands:
    - {id: vnc-info, name: VNC 보안 방식 확인, description: VNC 프로토콜과 지원 인증 방식을 확인합니다., command: "nmap -Pn -p{port} --script vnc-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: vnc-default-audit, name: VNC 기본 비밀번호 제한 점검, description: VNC에 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script vnc-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=4,brute.firstonly=true,brute.retries=0,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
mongodb:
  display_name: MongoDB
  match: {services: [mongodb], ports: [27017]}
  commands:
    - {id: mongodb-info, name: MongoDB 무인증 정보 확인, description: 인증 없이 MongoDB 빌드와 서버 정보가 공개되는지 확인합니다., command: "nmap -Pn -p{port} --script mongodb-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: mongodb-default-audit, name: MongoDB 기본 자격증명 제한 점검, description: MongoDB에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script mongodb-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
rsync:
  display_name: Rsync
  match: {services: [rsync], ports: [873]}
  commands:
