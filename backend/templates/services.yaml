target_identity:
  display_name: Target identity
  match: {services: [], ports: []}
  commands:
    - {id: target-hostname-identity, name: Hostname 확인, description: 역방향 DNS 조회로 대상이 공개하는 Hostname을 확인하고 Target에 자동 저장합니다., command: "nmap -sn -R -oX {output_dir}/target-hostname-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: target-os-identity, name: 운영체제·호스트명 식별, description: Nmap OS 탐지와 역방향 호스트명 조회를 실행하고 관찰된 운영체제와 호스트명을 Target에 자동 저장합니다. OS 탐지는 권한이 필요합니다., command: "nmap -O --osscan-guess -oX {output_dir}/target-os-identity.xml {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: true, output: text, policy: allowed}
ftp:
  display_name: FTP
  match: {services: [ftp], ports: [21]}
  commands:
    - {id: ftp-anon, name: FTP anonymous 자격증명 대입, description: FTP 프로토콜 데이터셋의 anonymous 계정을 한 번 대입하고 성공 즉시 종료합니다. 디렉터리 내용은 나열하지 않습니다., command: "nmap -Pn -p{port} --script ftp-anon --script-args ftp-anon.maxlist=0 {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ftp-syst, name: FTP 시스템 정보 확인, description: FTP 서버가 공개하는 시스템 정보를 조회합니다., command: "nmap -Pn -p{port} --script ftp-syst {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ftp-client, name: FTP 수동 접속, description: 자동 로그인 없이 대화형 FTP 클라이언트를 엽니다., command: "ftp {host} {port}", execution_mode: interactive, risk: low, tool: ftp, sudo: false, output: pty-log, policy: allowed}
ssh:
  display_name: SSH
  match: {services: [ssh], ports: [22]}
  commands:
    - {id: ssh-enum, name: SSH 알고리즘 확인, description: 서버가 지원하는 암호화·키 교환·MAC 알고리즘을 열람합니다., command: "nmap -Pn -p{port} --script ssh2-enum-algos {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ssh-auth-methods, name: SSH 인증 방식 확인, description: root 계정에 대해 서버가 허용하는 인증 방식만 확인하며 비밀번호 로그인은 시도하지 않습니다., command: "nmap -Pn -p{port} --script ssh-auth-methods --script-args ssh.user=root {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ssh-default-audit, name: SSH 기본 자격증명 제한 점검, description: Nmap 내장 목록에서 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다. 계정 잠금 가능성이 있습니다., command: "nmap -Pn -p{port} --script ssh-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ssh-client, name: SSH 수동 접속, description: SSH 클라이언트를 열고 사용자가 직접 인증합니다., command: "ssh -p {port} {username}@{host}", execution_mode: interactive, risk: low, tool: ssh, sudo: false, output: pty-log, policy: allowed}
    - {id: ssh-credential-check-netexec, name: SSH 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 SSH 인증 성공 여부만 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc ssh {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
kerberos:
  display_name: Kerberos
  match: {services: [kerberos-sec, kerberos], ports: [88]}
  commands:
    - {id: kerberos-user-enum-kerbrute, name: 사용자명 열거 (kerbrute), description: Kerberos Pre-Auth 요청으로 워드리스트에 있는 사용자명 중 실제로 존재하는 계정만 확인합니다. 비밀번호를 대입하지 않으며 계정 잠금을 유발하지 않습니다., command: "kerbrute userenum -d {domain} --dc {host} {wordlist}", execution_mode: captured, risk: low, tool: kerbrute, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
telnet:
  display_name: Telnet
  match: {services: [telnet], ports: [23]}
  commands:
    - {id: telnet-info, name: Telnet 상세 정보 확인, description: 모든 Nmap 서비스 Probe와 Telnet 협상 정보를 확인하고 관찰된 제품과 버전을 저장합니다., command: "nmap -Pn -sV --version-all -p{port} --script telnet-encryption,telnet-ntlm-info -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-banner, name: Telnet 원시 배너 확인, description: Banner NSE로 로그인 전 서버가 직접 공개하는 제품·버전 문자열을 추가 수집합니다., command: "nmap -Pn -p{port} --script banner {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-version-trace, name: Telnet 버전 Probe 추적, description: Nmap의 모든 버전 Probe와 응답을 상세 출력하고 식별된 값을 다시 저장합니다., command: "nmap -Pn -sV --version-all --version-trace -p{port} -oX {output_dir}/service-{port}-identity-trace.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-default-audit, name: Telnet 기본 자격증명 제한 점검, description: Nmap 내장 목록에서 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다. 계정 잠금 가능성이 있습니다., command: "nmap -Pn -p{port} --script telnet-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m,telnet-brute.timeout=8s {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-client, name: Telnet 수동 접속, description: 사용자가 직접 상호작용할 수 있는 Telnet 클라이언트를 엽니다., command: "telnet {host} {port}", execution_mode: interactive, risk: medium, tool: telnet, sudo: false, output: pty-log, policy: allowed}
smtp:
  display_name: SMTP
  match: {services: [smtp, smtps, submission], ports: [25, 465, 587]}
  commands:
    - {id: smtp-info, name: SMTP 명령 확인, description: SMTP 서버가 공개하는 지원 명령을 열람합니다., command: "nmap -Pn -p{port} --script smtp-commands {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: smtp-default-audit, name: SMTP 기본 자격증명 제한 점검, description: 서버가 제공하는 SMTP 인증 방식에 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script smtp-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
dns:
  display_name: DNS
  match: {services: [domain, dns], ports: [53]}
  commands:
    - {id: dns-info, name: DNS 서비스 정보 확인, description: DNS 버전 단서와 재귀 질의 허용 여부를 확인합니다., command: "nmap -Pn -p{port} --script dns-nsid,dns-recursion {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
http:
  display_name: HTTP
  match: {services: [http, https, http-proxy, ssl/http], ports: [80, 443, 8080, 8443]}
  commands:
    - {id: http-headers, name: HTTP 응답 헤더 확인, description: 대상 웹 서비스의 응답 헤더를 조회합니다., command: "curl -k -I {scheme}://{host}:{port}", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: http-whatweb, name: 웹 기술 식별, description: WhatWeb으로 사용 중인 웹 기술과 제품 단서를 확인합니다., command: "whatweb {scheme}://{host}:{port}", execution_mode: captured, risk: low, tool: whatweb, sudo: false, output: text, policy: allowed}
    - {id: graphql-introspection, name: GraphQL 스키마 조회 (introspection), description: /graphql 엔드포인트에 introspection 쿼리를 보내 전체 타입·필드 스키마를 확인합니다. 인증 없이 introspection이 열려 있으면 숨겨진 쿼리·필드 구조가 그대로 드러납니다., command: "curl -s -X POST {scheme}://{host}:{port}/graphql -H 'Content-Type: application/json' -d '{{\"query\": \"{{ __schema {{ types {{ name fields {{ name }} }} }} }} \"}}'", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: http-auth-finder, name: HTTP 인증 경로 확인, description: 웹사이트에서 Basic·Digest·NTLM 인증이 적용된 경로를 찾습니다. Form 로그인은 Web Testing에서 경로와 필드를 직접 확인해야 합니다., command: "nmap -Pn -p{port} --script http-auth-finder {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: http-default-audit, name: HTTP 루트 인증 제한 점검, description: 루트 경로의 Basic·Digest·NTLM 인증에 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다. Form 로그인은 포함하지 않습니다., command: "nmap -Pn -p{port} --script http-brute --script-args http-brute.path=/,brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: http-directory-fuzz, name: 디렉터리·파일 퍼징 (feroxbuster), description: 정적 워드리스트로 존재하는 경로를 찾습니다. 재귀 탐색은 하지 않으며 발견된 항목만 표시합니다., command: "feroxbuster -u {scheme}://{host}:{port}/ -w {wordlist} --json --silent -n", execution_mode: captured, risk: medium, tool: feroxbuster, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: http-vhost-fuzz, name: "가상 호스트 퍼징 (ffuf)", description: "Host 헤더를 워드리스트로 대입해 같은 IP·포트에 라우팅되는 다른 가상 호스트(서브도메인)를 찾습니다. 모든 응답을 보여주므로 baseline과 크기가 다른 결과 위주로 확인하세요.", command: "ffuf -u {scheme}://{host}:{port}/ -H \"Host: FUZZ.{domain}\" -w {wordlist} -mc all -t 40", execution_mode: captured, risk: medium, tool: ffuf, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
smb:
  display_name: SMB and RPC
  match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}
  commands:
    - {id: smb-enum, name: SMB 익명 공유 목록 확인, description: smbclient로 비밀번호 없이 접속해 서버가 공개하는 공유 이름·형식·설명을 직접 수집합니다., command: "smbclient -N -L //{host} -p {port}", execution_mode: captured, risk: low, tool: smbclient, sudo: false, output: text, policy: allowed}
    - {id: smb-null-session, name: SMB 익명 사용자 확인, description: rpcclient Null 세션으로 도메인 사용자 열거가 허용되는지 확인합니다., command: "rpcclient -N -U '' {host} -p {port} -c enumdomusers", execution_mode: captured, risk: low, tool: rpcclient, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-default-audit, name: SMB 기본 자격증명 제한 점검, description: SMB 자체 잠금 감지를 유지하며 사용자 8개와 비밀번호 4개 및 빈·사용자 기반 후보를 점검합니다. 속도 지연은 지원되지 않습니다., command: "nmap -Pn -p{port} --script smb-brute --script-args brutelimit=8,canaries=3,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-client, name: SMB 수동 접속, description: smbclient를 열고 사용자가 직접 인증합니다., command: "smbclient -L //{host} -p {port}", execution_mode: interactive, risk: low, tool: smbclient, sudo: false, output: pty-log, policy: allowed}
    - {id: smb-share-client, name: 선택한 SMB 공유 접속, description: 공유 목록에서 선택한 공유에 익명 세션으로 접속합니다., command: "smbclient //{host}/{share} -N -p {port}", execution_mode: interactive, risk: low, tool: smbclient, sudo: false, output: pty-log, policy: allowed, match: {services: [], ports: []}}
    - {id: smb-share-spider, name: 선택한 SMB 공유 재귀 파일 목록, description: 선택한 공유의 하위 디렉터리를 재귀적으로 순회해 접근 가능한 파일 경로를 한 번에 수집합니다. 파일을 내려받지 않습니다., command: "smbclient -N //{host}/{share} -p {port} -c 'recurse ON;ls'", execution_mode: captured, risk: low, tool: smbclient, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: smb-spider-netexec, name: SMB 전체 공유 재귀 파일 목록 (NetExec), description: NetExec spider_plus 모듈로 접근 가능한 모든 공유를 자동으로 찾아 재귀적으로 파일 목록을 수집합니다. DOWNLOAD_FLAG 기본값(false)을 유지해 파일을 내려받지 않습니다., command: "nxc smb {host} --port {port} -u '' -p '' -M spider_plus", execution_mode: captured, risk: low, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-credential-check-netexec, name: SMB 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 인증 성공 여부와 로컬 관리자 권한을 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc smb {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-lookupsid-impacket, name: SID 순환 사용자 열거 (Impacket lookupsid), description: 유효한 계정으로 RID를 순차 대입해 로컬·도메인 사용자·그룹을 열거합니다. rpcclient Null 세션이 막혀 있어도 낮은 권한 계정 하나만 있으면 통하는 경우가 많습니다., command: "impacket-lookupsid {domain}/{username}:{password}@{host}", execution_mode: captured, risk: low, tool: impacket-lookupsid, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: smb-share-file-view, name: 공유 파일 원문 보기, description: 재귀 목록에서 찾은 파일 하나를 로컬에 내려받지 않고 표준출력으로 바로 확인합니다., command: "smbget -a -q --stdout smb://{host}/{share}/{path}", execution_mode: captured, risk: low, tool: smbget, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
nfs:
  display_name: NFS
  match: {services: [nfs, rpcbind], ports: [111, 2049]}
  commands:
    - {id: nfs-showmount, name: NFS 내보내기 목록, description: 대상이 공개한 NFS 경로를 열람합니다., command: "showmount -e {host}", execution_mode: captured, risk: low, tool: showmount, sudo: false, output: text, policy: allowed}
ldap:
  display_name: LDAP and Kerberos
  match: {services: [ldap, ldaps, kerberos-sec], ports: [88, 389, 636]}
  commands:
    - {id: ldap-rootdse, name: LDAP RootDSE 확인, description: 인증 없이 공개된 LDAP RootDSE 메타데이터를 조회합니다., command: "nmap -Pn -p{port} --script ldap-rootdse {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ldap-anonymous-users, name: LDAP 익명 사용자 열거, description: 익명(널 세션) LDAP bind로 도메인 사용자 목록을 조회합니다. 성공하면 자격증명 없이 얻은 사용자명으로 AS-REP Roasting·패스워드 스프레이의 시작점이 됩니다., command: "nxc ldap {host} --port {port} -u '' -p '' --users", execution_mode: captured, risk: low, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [ldap, ldaps], ports: [389, 636]}}
    - {id: ldap-default-audit, name: LDAP 기본 자격증명 제한 점검, description: LDAP의 별도 반복 엔진으로 사용자 8개와 비밀번호 4개를 최대 2분 동안 점검합니다. 지연·계정별 제한은 지원되지 않으며 Base DN이 필요할 수 있습니다., command: "nmap -Pn -p{port} --script ldap-brute --script-args unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [ldap, ldaps], ports: [389, 636]}}
    - {id: ldap-credential-check-netexec, name: LDAP 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 LDAP·도메인 인증 성공 여부를 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc ldap {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-kerberoast-netexec, name: Kerberoasting (NetExec), description: 인증된 도메인 계정 하나로 SPN이 등록된 계정의 TGS 티켓을 요청해 크랙 가능한 해시를 수집합니다. 크래킹 자체는 별도로 직접 진행해야 합니다., command: "nxc ldap {host} -u {username} -p {password} --kerberoasting {output_dir}/kerberoast-hashes.txt", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-asreproast-impacket, name: AS-REP Roasting (Impacket), description: 자격증명 없이 사용자 목록만으로 Kerberos Pre-Auth를 요구하지 않는(UF_DONT_REQUIRE_PREAUTH) 계정의 AS-REP 해시를 수집합니다. 해당 없는 계정은 로그에만 표시되고, 실제 크랙 가능한 해시는 결과 파일에만 저장됩니다., command: "impacket-GetNPUsers {domain}/ -usersfile {wordlist} -no-pass -dc-ip {host} -outputfile {output_dir}/asrep-hashes.txt", execution_mode: captured, risk: low, tool: impacket-GetNPUsers, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-password-spray-netexec, name: 패스워드 스프레이 (NetExec), description: 발견한 사용자 목록에 비밀번호 하나를 대입해 유효한 조합을 찾습니다. OSCP 시험 방법론상 허용되는 기법이지만 계정 잠금 정책을 반드시 먼저 확인하세요., command: "nxc ldap {host} -u {wordlist} -p {password} --continue-on-success", execution_mode: captured, risk: high, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-bloodhound-collect, name: BloodHound 데이터 수집 (bloodhound-python), description: 유효한 도메인 계정으로 LDAP·SMB를 통해 사용자·그룹·세션·ACL 정보를 수집해 BloodHound GUI에서 열 수 있는 zip으로 저장합니다. 공격 경로 분석 자체는 BloodHound 앱에서 진행하세요., command: "bloodhound-python -u {username} -p {password} -d {domain} -ns {host} -c All --zip", execution_mode: captured, risk: low, tool: bloodhound-python, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-dcsync-secretsdump, name: DCSync (Impacket secretsdump), description: 유효한 도메인 계정에 디렉터리 복제 권한(DCSync)이 있는지 시도해 NTDS.dit 전체 계정 해시를 덤프합니다. 권한이 없으면 실패하며, BloodHound에서 해당 권한 경로를 먼저 확인하는 것을 권장합니다., command: "impacket-secretsdump {domain}/{username}:{password}@{host} -just-dc -outputfile {output_dir}/dcsync", execution_mode: captured, risk: medium, tool: impacket-secretsdump, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-silver-ticket-ticketer, name: "Silver Ticket 위조 (Impacket ticketer.py)", description: "서비스 계정의 NTLM 해시와 도메인 SID로 원하는 그룹 권한을 가진 위조 서비스 티켓(.ccache)을 생성합니다. NTLM 해시는 예를 들어 xp_dirtree/PetitPotam 등으로 캡처한 NetNTLMv2를 크랙하거나 DCSync로 덤프해 얻을 수 있습니다. 생성된 티켓 파일은 이 실행의 작업 디렉터리에 <대상 사용자명>.ccache로 저장됩니다.", command: "impacket-ticketer -nthash {nthash} -domain-sid {domain_sid} -domain {domain} -spn {spn} -groups {groups} {target_username}", execution_mode: captured, risk: high, tool: impacket-ticketer, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
database:
  display_name: Databases
  match: {services: [ms-sql-s, mysql, postgresql, redis], ports: [1433, 3306, 5432, 6379]}
  commands:
    - {id: database-info, name: 데이터베이스 서비스 정보, description: 인증을 시도하지 않고 관찰된 데이터베이스 제품과 버전을 저장합니다., command: "nmap -Pn -sV -p{port} -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: mysql-empty-password, name: MySQL 빈 비밀번호 확인, description: MySQL 계정의 빈 비밀번호 허용 여부를 확인합니다., command: "nmap -Pn -p{port} --script mysql-empty-password {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [mysql], ports: [3306]}}
    - {id: mysql-default-audit, name: MySQL 기본 자격증명 제한 점검, description: MySQL에 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script mysql-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [mysql], ports: [3306]}}
    - {id: postgres-default-audit, name: PostgreSQL 기본 자격증명 제한 점검, description: PostgreSQL의 순차 반복 엔진으로 사용자 8개와 비밀번호 4개를 최대 2분 동안 점검합니다. 지연·첫 성공 중단은 지원되지 않습니다., command: "nmap -Pn -p{port} --script pgsql-brute --script-args unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [postgresql], ports: [5432]}}
    - {id: mssql-empty-password, name: MS SQL 빈 비밀번호 확인, description: SQL 계정의 빈 비밀번호 허용 여부를 확인하며 Windows 계정은 시도하지 않습니다., command: "nmap -Pn -p{port} --script ms-sql-empty-password {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [ms-sql-s], ports: [1433]}}
    - {id: mssql-default-audit, name: MS SQL 기본 자격증명 제한 점검, description: MS SQL의 잠금 감지 엔진으로 사용자 8개와 비밀번호 4개를 최대 2분 동안 점검합니다. Windows 계정과 잠금 무시 옵션은 사용하지 않습니다., command: "nmap -Pn -p{port} --script ms-sql-brute --script-args unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [ms-sql-s], ports: [1433]}}
    - {id: mssql-credential-check-netexec, name: MS SQL 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 MS SQL 인증 성공 여부와 명령 실행 권한을 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc mssql {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: mssql-rid-brute-netexec, name: RID 순환 사용자 열거 (NetExec MSSQL), description: 유효한 MS SQL 계정(로컬 SQL 로그인도 가능) 하나로 RID를 순차 대입해 도메인 사용자·그룹을 열거합니다. SMB Null 세션과 rpcclient가 막혀 있어도 MS SQL 게스트 접근만 있으면 통하는 경우가 많습니다., command: "nxc mssql {host} --port {port} -u {username} -p {password} --rid-brute", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: redis-unauthenticated-info, name: Redis 무인증 접근 확인, description: 인증 없이 INFO 명령이 허용되는지 확인합니다., command: "nmap -Pn -p{port} --script redis-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [redis], ports: [6379]}}
    - {id: redis-default-audit, name: Redis 기본 비밀번호 제한 점검, description: Redis 인증에 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script redis-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=4,brute.firstonly=true,brute.retries=0,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [redis], ports: [6379]}}
rdp:
  display_name: RDP and WinRM
  match: {services: [ms-wbt-server, wsman, wsmans], ports: [3389, 5985, 5986]}
  commands:
