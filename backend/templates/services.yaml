    - {id: ike-scan-aggressive-pskcrack, name: IKE Aggressive 모드 · PSK 해시 추출, description: Aggressive 모드가 활성화되어 있는지 확인하고, 활성화된 경우 hashcat -m 5400으로 대입 가능한 PSK 해시를 표준출력으로 바로 뽑아냅니다., command: "ike-scan -M -A --pskcrack=/dev/stdout {host}", execution_mode: captured, risk: medium, tool: ike-scan, sudo: false, output: text, policy: allowed}
tftp:
  display_name: TFTP
  match: {services: [tftp], ports: [69]}
  commands:
    - {id: tftp-get-file, name: TFTP 파일 다운로드, description: "파일명을 알고 있을 때(예: Cisco 라우터 설정 파일) TFTP로 받아 표준출력에 그대로 표시합니다. Type 7로 인코딩된 비밀번호가 있다면 Cisco Type 7 디코더로 바로 이어 사용할 수 있습니다.", command: "curl -s tftp://{host}/{path}", execution_mode: captured, risk: low, tool: curl, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
unknown:
  display_name: Unknown
  match: {services: [unknown], ports: []}
  commands:
    - {id: service-version, name: 제품·버전 식별, description: 모든 Nmap 서비스 Probe로 제품과 버전을 식별하고 관찰된 값을 이 서비스에 자동 저장합니다., command: "nmap -Pn -sV --version-all -p{port} -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed}
    - {id: service-version-udp, name: UDP 제품·버전 식별, description: 모든 Nmap UDP 서비스 Probe로 제품과 버전을 식별하고 관찰된 값을 이 서비스에 자동 저장합니다., command: "nmap -Pn -sU -sV --version-all -p{port} -oX {output_dir}/service-{port}-identity.xml {host}", execution_mode: captured, risk: medium, tool: nmap, sudo: true, output: text, policy: allowed}

# Data-driven Service Intelligence extensions. Each command carries its own
# matcher so adding knowledge does not require another port condition in code.
service_intelligence_extensions:
  display_name: Service Intelligence
  match: {services: [], ports: []}
  commands:
    - {id: generic-banner, name: 범용 배너 수집, description: 식별되지 않은 TCP 서비스의 배너를 안전하게 수집합니다., command: "nmap -Pn -p{port} --script banner {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [unknown, tcpwrapped], ports: []}}
    - {id: generic-tls-probe, name: TLS 여부와 인증서 확인, description: 알 수 없는 포트가 TLS를 사용하는지와 인증서·암호군을 확인합니다., command: "nmap -Pn -p{port} --script ssl-cert,ssl-enum-ciphers {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [unknown, tcpwrapped], ports: []}}
    - {id: generic-http-probe, name: HTTP 계열 여부 확인, description: 비표준 포트가 HTTP 응답을 제공하는지 제목과 헤더로 확인합니다., command: "nmap -Pn -p{port} --script http-title,http-headers {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [unknown, tcpwrapped], ports: []}}
    - {id: msrpc-enum, name: RPC 인터페이스 열거, description: Impacket으로 TCP Endpoint Mapper에 직접 연결해 UUID와 동적 endpoint를 수집합니다. RPC 메서드는 호출하지 않습니다., command: "{repo_dir}/.venv/bin/python -m app.rpc_probe endpoints --host {host} --port {port}", execution_mode: captured, risk: low, tool: python3, sudo: false, output: text, policy: allowed, match: {services: [msrpc, epmap], ports: [135]}}
    - {id: msrpc-bind-check, name: RPC 인터페이스 bind 확인, description: Endpoint Mapper가 반환한 TCP 인터페이스에 DCE/RPC bind만 수행해 익명 bind·접근 거부·인증 요구·연결 실패를 구분합니다. RPC 메서드는 호출하지 않습니다., command: "{repo_dir}/.venv/bin/python -m app.rpc_probe bind --host {host} --port {port} --max-bindings 64", execution_mode: captured, risk: medium, tool: python3, sudo: false, output: text, policy: allowed, match: {services: [msrpc, epmap], ports: [135]}}
    - {id: smb-security, name: SMB 프로토콜과 서명 확인, description: 지원 SMB 버전과 서명 요구 여부, 서버 시간을 확인합니다., command: "nmap -Pn -p{port} --script smb-protocols,smb2-security-mode,smb2-time {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [microsoft-ds, netbios-ssn, smb], ports: [139, 445]}}
    - {id: http-methods, name: HTTP 허용 메서드 확인, description: 서버가 공개한 HTTP 메서드와 잠재적으로 위험한 메서드를 확인합니다., command: "nmap -Pn -p{port} --script http-methods {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [http, https, http-proxy, ssl/http], ports: [80, 443, 8080, 8443]}}
    - {id: http-tls-info, name: HTTP TLS 구성 확인, description: HTTPS 인증서와 암호군 구성을 수집합니다., command: "nmap -Pn -p{port} --script ssl-cert,ssl-enum-ciphers {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [https, ssl/http], ports: [443, 8443]}}
    - {id: winrm-info, name: WinRM 전송·인증 표면 확인, description: WinRM HTTP endpoint의 응답 헤더와 허용 메서드, 인증 challenge를 확인합니다., command: "nmap -Pn -p{port} --script http-headers,http-methods,http-auth-finder {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [wsman, wsmans, winrm], ports: [5985, 5986, 47001]}}
    - {id: winrm-tls-info, name: WinRM TLS 구성 확인, description: HTTPS WinRM endpoint의 인증서와 암호군을 확인합니다., command: "nmap -Pn -p{port} --script ssl-cert,ssl-enum-ciphers {host}", execution_mode: captured, risk: low, tool: nmap, sudo: false, output: text, policy: allowed, match: {services: [wsmans], ports: [5986]}}
    - {id: winrm-credential-check-netexec, name: WinRM 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 WinRM 인증 성공 여부와 관리자 권한을 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc winrm {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
