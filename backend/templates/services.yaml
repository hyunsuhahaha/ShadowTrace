    - {id: rsync-default-audit, name: Rsync 기본 자격증명 제한 점검, description: Rsync 인증에 사용자 8개와 비밀번호 4개만 최대 2분 동안 저속으로 점검합니다., command: "nmap -Pn -p{port} --script rsync-brute --script-args brute.start=2,brute.threads=2,brute.delay=2,brute.guesses=3,brute.firstonly=true,brute.retries=0,unpwdb.userlimit=8,unpwdb.passlimit=4,unpwdb.timelimit=2m {host}", execution_mode: captured, risk: high, tool: nmap, sudo: false, output: text, policy: allowed}
ike:
  display_name: IKE/IPsec
  match: {services: [isakmp], ports: [500]}
  commands:
