    - {id: rdp-default-audit, name: RDP 기본 계정 제한 점검, description: Nmap 기본 사용자 10개에 대해 빈 비밀번호·사용자명과 같은 비밀번호·역순 사용자명만 Hydra 2개 연결로 점검합니다. 도메인 계정은 포함하지 않습니다., command: "hydra -L /usr/share/nmap/nselib/data/usernames.lst -e nsr -t 2 -W 2 -f -s {port} rdp://{host}", execution_mode: captured, risk: high, tool: hydra, sudo: false, output: text, policy: allowed, match: {services: [ms-wbt-server], ports: [3389]}}
    - {id: rdp-credential-check-netexec, name: RDP 자격증명 확인 (NetExec), description: 사용자가 입력한 특정 계정 하나를 NetExec으로 대입해 RDP 인증 성공 여부만 확인합니다. 대입 공격이 아니라 단일 계정 검증입니다., command: "nxc rdp {host} --port {port} -u {username} -p {password}", execution_mode: captured, risk: medium, tool: netexec, sudo: false, output: text, policy: allowed, match: {services: [], ports: []}}
snmp:
  display_name: SNMP
