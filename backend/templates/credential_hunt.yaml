schema_version: 1
# Static, user-selected post-exploitation commands for hunting credentials on a
# host the user already has legitimate access to (SSH key, or Windows admin
# creds/hash). Every entry here is a fixed command reviewed before it runs —
# there is no freeform command field anywhere in this feature.
commands:
  - id: linux_config_grep
    category: config_files
    os: linux
    name: 설정 파일 내 평문 비밀번호 검색
    description: /etc, /opt, 웹 루트에서 password/secret/apikey 문자열을 포함하는 파일을 찾습니다.
    connection: ssh
    command: 'grep -RIln -i "password\|passwd\|secret\|apikey\|api_key" /etc /opt /var/www /srv 2>/dev/null | head -200'
    risk: low
    default_timeout: 60

  - id: windows_config_search
    category: config_files
    os: windows
    name: 설정 파일 내 평문 비밀번호 검색
    description: C:\ 전체에서 password 문자열을 포함하는 .config/.ini/.xml 파일을 찾습니다.
    connection: wmiexec
    command: powershell -c "Get-ChildItem C:\ -Recurse -Include *.config,*.ini,*.xml -ErrorAction SilentlyContinue | Select-String -Pattern password -List | Select-Object Path | Format-Table -HideTableHeaders"
    risk: low
    default_timeout: 120

  - id: linux_web_db_creds
    category: web_db_creds
    os: linux
    name: 웹 애플리케이션 DB 접속 정보 파일 검색
    description: 일반적인 웹 애플리케이션 설정 파일(wp-config.php, .env, database.yml 등)을 찾습니다.
    connection: ssh
    command: find / -iname "wp-config.php" -o -iname "config.php" -o -iname ".env" -o -iname "database.yml" -o -iname "settings.py" 2>/dev/null
    risk: low
    default_timeout: 90

  - id: windows_web_db_creds
    category: web_db_creds
    os: windows
    name: 웹 애플리케이션 DB 접속 정보 파일 검색
    description: IIS/일반 웹 루트에서 web.config, wp-config.php 등을 찾습니다.
    connection: wmiexec
    command: powershell -c "Get-ChildItem -Path C:\inetpub,C:\wwwroot -Recurse -Include web.config,wp-config.php,.env -ErrorAction SilentlyContinue | Select-Object FullName"
    risk: low
    default_timeout: 90

  - id: linux_backup_files
    category: backups
    os: linux
    name: 백업/구버전 파일 검색
    description: .bak/.old/backup 등 이름 패턴을 가진 백업 파일을 찾습니다.
    connection: ssh
    command: find / \( -iname "*.bak" -o -iname "*.old" -o -iname "*~" -o -iname "*backup*" -o -iname "*.tar.gz" -o -iname "*.zip" \) -not -path "/proc/*" 2>/dev/null | head -200
    risk: low
    default_timeout: 90

  - id: windows_backup_files
    category: backups
    os: windows
    name: 백업/구버전 파일 검색
    description: .bak/.old/backup 이름 패턴을 가진 파일을 C:\ 전체에서 찾습니다.
    connection: wmiexec
    command: powershell -c "Get-ChildItem -Path C:\ -Recurse -Include *.bak,*.old,*backup* -ErrorAction SilentlyContinue | Select-Object -First 200 FullName"
    risk: low
    default_timeout: 120

  - id: linux_browser_script_env
    category: browser_script_env
    os: linux
    name: 환경변수·셸 히스토리·브라우저 프로필 확인
    description: 현재 세션의 환경변수, 셸 히스토리 파일, 브라우저 프로필 디렉터리를 확인합니다.
    connection: ssh
    command: env; echo ---; find / -iname ".*_history" 2>/dev/null; echo ---; find /home /root -maxdepth 3 -iname "*.mozilla*" -o -iname "*chrome*" 2>/dev/null
    risk: low
    default_timeout: 60

  - id: windows_browser_script_env
    category: browser_script_env
    os: windows
    name: 환경변수·PowerShell 히스토리 확인
    description: 환경변수와 PowerShell 명령 기록(ConsoleHost_history.txt)을 확인합니다.
    connection: wmiexec
    command: powershell -c "Get-ChildItem Env:; Write-Output ---; Get-Content (Get-PSReadlineOption).HistorySavePath -ErrorAction SilentlyContinue"
    risk: low
    default_timeout: 60

  - id: linux_other_home_dirs
    category: other_home_dirs
    os: linux
    name: 다른 사용자 홈 디렉터리 내 읽기 가능한 파일 확인
    description: /home 이하에서 현재 권한으로 읽을 수 있는 파일 목록을 확인합니다.
    connection: ssh
    command: find /home -maxdepth 4 -readable -type f 2>/dev/null | grep -vE "\.(cache|local/share)" | head -300
    risk: low
    default_timeout: 60

  - id: windows_other_home_dirs
    category: other_home_dirs
    os: windows
    name: 다른 사용자 홈 디렉터리 목록 확인
    description: C:\Users 아래의 사용자 계정과 접근 가능한 파일을 확인합니다.
    connection: wmiexec
    command: powershell -c "Get-ChildItem C:\Users -Force -ErrorAction SilentlyContinue | Select-Object Name; Write-Output ---; Get-ChildItem C:\Users -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 300 FullName"
    risk: low
    default_timeout: 90

  - id: windows_cred_manager_list
    category: windows_cred_manager
    os: windows
    name: Windows Credential Manager 저장 자격 증명 확인
    description: cmdkey /list로 저장된 자격 증명 대상을 확인합니다 (비밀번호 자체는 노출되지 않음, vaultcmd로 추가 확인 필요할 수 있음).
    connection: wmiexec
    command: cmdkey /list
    risk: low
    default_timeout: 30

  - id: linux_ssh_keys
    category: ssh_keys
    os: linux
    name: SSH 개인 키·authorized_keys 검색
    description: id_rsa 등 개인 키 파일과 authorized_keys, known_hosts를 찾습니다.
    connection: ssh
    command: find / -name "id_rsa*" -o -name "id_ed25519*" -o -name "id_ecdsa*" -o -name "authorized_keys" -o -name "known_hosts" 2>/dev/null
    risk: medium
    default_timeout: 60

  - id: windows_ssh_keys
    category: ssh_keys
    os: windows
    name: SSH 키·PuTTY 세션 검색
    description: OpenSSH 클라이언트 키 디렉터리와 PuTTY 저장 세션(레지스트리)을 확인합니다.
    connection: wmiexec
    command: powershell -c "Get-ChildItem $env:USERPROFILE\.ssh -Recurse -ErrorAction SilentlyContinue; Write-Output ---; reg query 'HKCU\Software\SimonTatham\PuTTY\Sessions' 2>$null"
    risk: medium
    default_timeout: 60

  - id: linux_notes_docs_logs
    category: notes_docs_logs
    os: linux
    name: 메모·문서·로그 파일 검색
    description: 최근 수정된 텍스트/문서/로그 파일을 찾습니다.
    connection: ssh
    command: find / \( -iname "*.txt" -o -iname "*.md" -o -iname "*.log" \) -newer /etc/hostname -not -path "/proc/*" -not -path "/var/log/*" 2>/dev/null | head -300
    risk: low
    default_timeout: 90

  - id: windows_notes_docs_logs
    category: notes_docs_logs
    os: windows
    name: 메모·문서·로그 파일 검색
    description: 사용자 디렉터리 내 텍스트/문서/로그 파일을 찾습니다.
    connection: wmiexec
    command: powershell -c "Get-ChildItem C:\Users -Recurse -Include *.txt,*.md,*.docx,*.log -ErrorAction SilentlyContinue | Select-Object -First 300 FullName"
    risk: low
    default_timeout: 120

  - id: linux_post_privesc_hashes
    category: post_privesc_hashes
    os: linux
    name: /etc/shadow 확인 (권한 상승 후)
    description: root 권한 확보 후 계정 해시를 확인합니다. 권한이 없으면 Permission denied로 실패합니다.
    connection: ssh
    command: cat /etc/shadow 2>&1
    risk: high
    default_timeout: 30

  - id: windows_post_privesc_hashes
    category: post_privesc_hashes
    os: windows
    name: SAM/로컬 계정 해시 덤프 (secretsdump)
    description: 로컬 관리자 자격 증명(또는 NTLM 해시)으로 SAM에서 로컬 계정 해시를 덤프합니다.
    connection: secretsdump
    command: ""
    risk: high
    default_timeout: 120

  - id: windows_backup_operators_hive_save
    category: post_privesc_hashes
    os: windows
    name: SAM/SYSTEM/SECURITY 레지스트리 하이브 저장 (Backup Operators)
    description: >-
      Backup Operators 그룹 멤버(SeBackupPrivilege)는 로컬 관리자가 아니어도 reg save로
      보호된 레지스트리 하이브를 백업할 수 있습니다 — secretsdump의 원격 SAM 덤프(표준 관리자
      권한 필요)가 통하지 않을 때의 대안입니다. C:\Windows\Temp에 저장된 하이브 파일은 이
      셸로 직접 내려받아 Kali에서 secretsdump.py -sam -system LOCAL로 오프라인 크래킹하세요.
    connection: wmiexec
    command: reg save HKLM\SAM C:\Windows\Temp\sam.hive /y && reg save HKLM\SYSTEM C:\Windows\Temp\system.hive /y && reg save HKLM\SECURITY C:\Windows\Temp\security.hive /y && dir C:\Windows\Temp\*.hive
    risk: high
    default_timeout: 60

  - id: windows_bloodhound_collection
    category: ad_recon
    os: windows
    name: BloodHound 데이터 수집
    description: 도메인 계정으로 BloodHound(Legacy) 컬렉터를 실행해 그룹·세션·ACL 등 AD 관계 데이터를 zip으로 수집합니다. 그래프 분석은 사용자가 로컬 BloodHound GUI에서 직접 진행합니다 — 이 앱은 그래프를 표시하지 않습니다.
    connection: bloodhound
    command: ""
    risk: medium
    default_timeout: 300
