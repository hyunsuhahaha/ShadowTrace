[project]
name = "oscp-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3", "python-multipart>=0.0.9", "PyYAML>=6,<7",
  "defusedxml>=0.7,<1", "alembic>=1.13,<2", "httpx>=0.27,<1",
  "Markdown>=3.6,<4", "weasyprint>=62,<70"
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.setuptools]
packages = ["app"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
